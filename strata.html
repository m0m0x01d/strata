<!doctype html>
<meta charset="utf-8">
<title>STRATA — web vulnerabilities in cross-section</title>

<style>
/* ────────────────────────────────────────────────────────────
   TOKENS
   Dark: the inside of an instrument — deep blue-slate, emissive.
   Light: drafting paper — cool cyan-grey, ink-blue linework.
   One warm hue in the whole system: --taint. Nothing else is warm.
   ──────────────────────────────────────────────────────────── */
:root{
  color-scheme: dark light;

  --void:#080C11;
  --strata:#0F161E;
  --raise:#16202B;
  --rule:#1E2E3B;
  --rule-2:#2C4152;
  --ink:#DCE8F0;
  --ice:#8FA9BC;
  --dim:#5A7286;

  --signal:#63D2E6;
  --signal-deep:#1D6C7C;
  --signal-wash:rgba(99,210,230,.10);

  --taint:#FFA24A;
  --taint-wash:rgba(255,162,74,.15);
  --taint-edge:rgba(255,162,74,.42);

  --breach:#FF6060;
  --breach-wash:rgba(255,96,96,.13);
  --ok:#5FD69B;

  --mono: ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;

  --gap:190px;     /* focus-mode depth between planes */
  --gapx:96px;     /* cross-section depth — tighter, so all 7 fit in frame */
  --tiltx:48deg;
  --spinx:-16deg;
  --zoomx:.72;
  --pw:780px;
  --ph:472px;
  --fan:44px;      /* focus-mode vertical offset per receding plane */
}

@media (prefers-color-scheme: light){
  :root{
    --void:#DCE5E9;
    --strata:#EEF3F5;
    --raise:#F9FBFC;
    --rule:#BDCDD4;
    --rule-2:#95A9B3;
    --ink:#0D1922;
    --ice:#415866;
    --dim:#71858F;

    --signal:#07697E;
    --signal-deep:#9BC4CE;
    --signal-wash:rgba(7,105,126,.09);

    --taint:#B14A05;
    --taint-wash:rgba(177,74,5,.11);
    --taint-edge:rgba(177,74,5,.40);

    --breach:#AF2118;
    --breach-wash:rgba(175,33,24,.10);
    --ok:#16714A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --void:#080C11; --strata:#0F161E; --raise:#16202B;
  --rule:#1E2E3B; --rule-2:#2C4152;
  --ink:#DCE8F0; --ice:#8FA9BC; --dim:#5A7286;
  --signal:#63D2E6; --signal-deep:#1D6C7C; --signal-wash:rgba(99,210,230,.10);
  --taint:#FFA24A; --taint-wash:rgba(255,162,74,.15); --taint-edge:rgba(255,162,74,.42);
  --breach:#FF6060; --breach-wash:rgba(255,96,96,.13); --ok:#5FD69B;
}
:root[data-theme="light"]{
  color-scheme: light;
  --void:#DCE5E9; --strata:#EEF3F5; --raise:#F9FBFC;
  --rule:#BDCDD4; --rule-2:#95A9B3;
  --ink:#0D1922; --ice:#415866; --dim:#71858F;
  --signal:#07697E; --signal-deep:#9BC4CE; --signal-wash:rgba(7,105,126,.09);
  --taint:#B14A05; --taint-wash:rgba(177,74,5,.11); --taint-edge:rgba(177,74,5,.40);
  --breach:#AF2118; --breach-wash:rgba(175,33,24,.10); --ok:#16714A;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* drafting-annotation register: wide-tracked uppercase mono */
.callout{
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.20em; text-transform:uppercase;
}
code,pre,.code{font-family:var(--mono); letter-spacing:0}

::selection{background:var(--taint-wash); color:var(--ink)}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:2px}

/* ── APP SHELL ─────────────────────────────────────────────── */
.app{
  height:100svh; min-height:660px; max-height:1000px;
  display:grid;
  grid-template-columns:212px minmax(0,1fr) 316px;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:
    radial-gradient(900px 620px at 50% 34%, var(--signal-wash), transparent 68%),
    var(--void);
}

/* ── TOP BAR ───────────────────────────────────────────────── */
.top{
  grid-column:1/-1; display:flex; align-items:center; gap:20px;
  padding:0 18px; height:52px;
  border-bottom:1px solid var(--rule);
  background:color-mix(in srgb, var(--strata) 72%, transparent);
}
.brand{display:flex; align-items:baseline; gap:10px}
.brand b{
  font-family:var(--mono); font-size:16px; font-weight:700;
  letter-spacing:.30em; color:var(--ink);
}
.brand .v{color:var(--dim); font-family:var(--mono); font-size:10px; letter-spacing:.14em}
.top .sep{width:1px; height:22px; background:var(--rule)}
.labname{display:flex; align-items:center; gap:9px; min-width:0}
.labname .ttl{font-size:13px; color:var(--ice)}
.labname .ttl b{color:var(--ink); font-weight:600}
.top .push{margin-left:auto; display:flex; align-items:center; gap:8px}

.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 9px; border:1px solid var(--rule-2); border-radius:999px;
  background:transparent; color:var(--ice); cursor:pointer;
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  transition:border-color .16s, color .16s, background .16s;
}
.pill:hover{border-color:var(--signal); color:var(--ink)}
.pill[aria-pressed="true"]{
  border-color:var(--signal); color:var(--signal);
  background:var(--signal-wash);
}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* ── LEFT RAIL: the stackup legend ─────────────────────────── */
.rail{
  border-right:1px solid var(--rule); padding:14px 0 10px;
  display:flex; flex-direction:column; min-height:0;
  background:color-mix(in srgb, var(--strata) 40%, transparent);
}
.rail h2, .side h2{
  margin:0 0 10px; padding:0 16px; color:var(--dim);
}
.stackup{
  list-style:none; margin:0; padding:0 10px; display:flex; flex-direction:column;
  overflow-y:auto; min-height:0;
}
.tier{
  position:relative; width:100%; text-align:left; cursor:pointer;
  display:grid; grid-template-columns:34px minmax(0,1fr); align-items:center;
  gap:9px; padding:7px 6px; border:0; border-radius:5px;
  background:transparent; color:inherit; font:inherit;
  transition:background .16s;
}
.tier:hover{background:var(--signal-wash)}
.tier .lc{
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.06em;
  color:var(--dim); text-align:right; font-variant-numeric:tabular-nums;
}
.tier .lt{
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ice);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tier .lm{grid-column:2; font-size:10.5px; color:var(--dim); margin-top:1px}
.tier[aria-current="true"] .lc{color:var(--signal)}
.tier[aria-current="true"] .lt{color:var(--ink)}
.tier[aria-current="true"]{background:var(--signal-wash)}
.tier[aria-current="true"]::before{
  content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
  background:var(--signal); border-radius:2px;
}
.tier.lit .lc{color:var(--taint)}

/* trust boundary marker inside the legend */
.boundary{
  display:flex; align-items:center; gap:8px; margin:5px 8px 5px 12px;
  color:var(--breach); white-space:nowrap;
}
.boundary::after{content:""; flex:1; height:1px;
  background:repeating-linear-gradient(90deg,var(--breach) 0 4px,transparent 4px 8px);
  opacity:.55}

.rail .foot{
  margin-top:auto; padding:12px 16px 2px; border-top:1px solid var(--rule);
  display:flex; flex-direction:column; gap:7px;
}
.key{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim)}
kbd{
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.04em;
  padding:2px 5px; border:1px solid var(--rule-2); border-radius:3px;
  background:var(--raise); color:var(--ice); white-space:nowrap;
}

/* ── CENTER STAGE: the 3D stack ────────────────────────────── */
.stage{
  position:relative; overflow:hidden;
  perspective:2300px; perspective-origin:50% 44%;
  transition:perspective-origin .7s cubic-bezier(.22,.9,.24,1);
}
.stage.is-cross{perspective-origin:50% 50%}
.grid-floor{
  position:absolute; inset:0; pointer-events:none; opacity:.30;
  background:
    linear-gradient(transparent 0, var(--void) 78%),
    repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 46px),
    repeating-linear-gradient(0deg, var(--rule) 0 1px, transparent 1px 46px);
  mask-image:radial-gradient(72% 62% at 50% 42%, #000 20%, transparent 78%);
}
.scene{
  position:absolute; inset:0; display:grid; place-items:center;
  transform-style:preserve-3d;
  transition:transform .78s cubic-bezier(.22,.9,.24,1);
}
.plane{
  grid-area:1/1; width:var(--pw); height:var(--ph);
  transform-style:preserve-3d;
  border:1px solid var(--rule-2); border-radius:7px;
  background:
    linear-gradient(180deg, color-mix(in srgb,var(--raise) 96%,transparent), var(--strata));
  /* shadow lives on .plane.active only — 7 large soft shadows on
     transformed layers was the single most expensive thing in the scene */
  box-shadow:none;
  will-change:transform;
  display:flex; flex-direction:column; overflow:hidden;
  transition:transform .78s cubic-bezier(.22,.9,.24,1), opacity .5s ease, filter .5s ease, border-color .3s, visibility 0s;
}
.plane.active{border-color:var(--signal-deep); box-shadow:0 26px 70px rgba(0,0,0,.42)}
.plane.pulse{border-color:var(--taint); box-shadow:0 0 0 1px var(--taint-edge), 0 26px 70px rgba(0,0,0,.42)}

/* Drafting callouts live as siblings of the planes, not inside them: .plane
   sets overflow:hidden, which flattens transform-style and would kill the
   counter-rotation that keeps these facing the camera. */
.callouts{grid-area:1/1; width:var(--pw); height:var(--ph); transform-style:preserve-3d; pointer-events:none}
.pcall{
  position:absolute; left:0; top:0; width:100%; transform-style:preserve-3d;
  display:flex; opacity:0; transition:opacity .4s ease;
}
.is-cross .pcall{opacity:1}
.pcall > span{
  display:flex; align-items:baseline; gap:10px; margin:9px 0 0 16px;
  transform-origin:left top;
  transform:rotateZ(calc(-1 * var(--spinx))) rotateX(calc(-1 * var(--tiltx)));
}
.pcall .bc{
  font-family:var(--mono); font-size:19px; font-weight:700; letter-spacing:.05em;
  color:var(--signal); text-shadow:0 2px 16px var(--void), 0 0 3px var(--void);
}
.pcall .bt{
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.24em;
  text-transform:uppercase; color:var(--ink); text-shadow:0 2px 16px var(--void), 0 0 3px var(--void);
}
.pcall .bm{font-family:var(--mono); font-size:10px; color:var(--ice); text-shadow:0 0 6px var(--void)}
.pcall.on .bc{color:var(--taint)}

/* Cross-section shows structure, not prose. The planes become glass so a
   callout six layers down isn't veiled by everything stacked in front of it,
   and the body text drops to pure texture. */
.is-cross .pbody{opacity:.13}
.is-cross .phead{opacity:0}
.is-cross .plane{
  background:color-mix(in srgb, var(--strata) 20%, transparent);
  box-shadow:none;
  border-color:var(--rule-2);
}
.is-cross .plane.active{
  background:color-mix(in srgb, var(--signal) 7%, transparent);
  border-color:var(--signal);
}

.phead{
  display:flex; align-items:center; gap:10px; flex:0 0 auto;
  padding:9px 13px; border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--void) 34%,transparent);
}
.phead .lc{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--signal); letter-spacing:.10em}
.phead .lt{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.20em; text-transform:uppercase}
.phead .lm{margin-left:auto; font-size:10.5px; color:var(--dim); font-family:var(--mono)}
.pbody{flex:1 1 auto; overflow:auto; padding:14px; overscroll-behavior:contain; contain:layout style}
.plane:not(.active) .pbody{overflow:hidden}

/* the trust-boundary plane floating in the stack */
.membrane{
  grid-area:1/1; width:calc(var(--pw) + 46px); height:calc(var(--ph) + 34px);
  border:1px dashed var(--breach); border-radius:9px;
  background:var(--breach-wash); pointer-events:none;
  display:grid; place-items:center;
  transition:transform .78s cubic-bezier(.22,.9,.24,1), opacity .45s ease;
}
.membrane span{
  font-family:var(--mono); font-size:10px; font-weight:700;
  letter-spacing:.24em; text-transform:uppercase; color:var(--breach);
  background:var(--void); padding:3px 10px; border-radius:3px;
}
.packet{
  grid-area:1/1; width:15px; height:15px; border-radius:50%;
  background:var(--taint); pointer-events:none; opacity:0;
  box-shadow:0 0 0 5px var(--taint-wash), 0 0 26px 5px var(--taint-edge);
}

/* ── LAYER CONTENT ─────────────────────────────────────────── */
.tn{                       /* THE taint mark — same everywhere, all 7 layers */
  background:var(--taint-wash);
  color:var(--taint);
  border-bottom:1px solid var(--taint-edge);
  border-radius:2px; padding:0 1px; font-weight:600;
}
.tn.syn{background:var(--taint); color:var(--void); border-bottom-color:transparent}
.dead{text-decoration:line-through; opacity:.5}
.unterm{color:var(--breach); background:var(--breach-wash); border-bottom:1px solid var(--breach)}
.kw{color:var(--signal)}
.str{color:var(--ok)}
.cm{color:var(--dim); font-style:italic}
.num{color:var(--ice)}

pre.src{
  margin:0; font-size:11.5px; line-height:1.68; white-space:pre;
  color:var(--ice); tab-size:2;
}
pre.src .ln{
  display:inline-block; width:20px; margin-right:12px; text-align:right;
  color:var(--dim); opacity:.55; user-select:none; font-variant-numeric:tabular-nums;
}
pre.src .hot{background:var(--taint-wash); display:block; margin:0 -14px; padding:0 14px}

.note{
  margin-top:12px; padding:9px 11px; border-left:2px solid var(--signal-deep);
  background:var(--signal-wash); border-radius:0 4px 4px 0;
  font-size:11.5px; line-height:1.55; color:var(--ice);
}
.note.warn{border-left-color:var(--breach); background:var(--breach-wash)}
.note b{color:var(--ink); font-weight:600}
.note .callout{display:block; margin-bottom:3px; color:var(--dim)}

/* L0 — the surface app */
.shop{display:flex; flex-direction:column; gap:11px; height:100%}
.shopbar{display:flex; align-items:center; gap:9px}
.shopbar .logo{
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.20em;
  color:var(--ink); text-transform:uppercase;
}
.shopbar .nav{margin-left:auto; display:flex; gap:14px; font-size:11px; color:var(--dim)}
.searchrow{display:flex; gap:7px}
.searchrow input{
  flex:1; min-width:0; padding:8px 11px; font-family:var(--mono); font-size:12px;
  color:var(--taint); background:var(--void);
  border:1px solid var(--rule-2); border-radius:5px;
}
.searchrow input::placeholder{color:var(--dim)}
.searchrow input:focus{outline:none; border-color:var(--taint); box-shadow:0 0 0 3px var(--taint-wash)}
.searchrow button{
  padding:8px 15px; border-radius:5px; cursor:pointer;
  border:1px solid var(--signal-deep); background:var(--signal-wash); color:var(--signal);
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
}
.searchrow button:hover{background:color-mix(in srgb,var(--signal) 18%,transparent)}
.hits{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; overflow:auto}
.hit{
  display:flex; align-items:center; gap:10px; padding:7px 10px;
  border:1px solid var(--rule); border-radius:5px; background:var(--void);
}
.hit .nm{font-size:12px; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hit .pr{font-family:var(--mono); font-size:11px; color:var(--ice); font-variant-numeric:tabular-nums}
.hit.leak{border-color:var(--taint-edge); background:var(--taint-wash)}
.hit.leak .nm{color:var(--taint); font-family:var(--mono); font-size:11px}
.tag{
  font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; padding:2px 5px; border-radius:3px;
  border:1px solid currentColor; color:var(--taint);
}
.tag.hidden-row{color:var(--breach)}
.crash{
  border:1px solid var(--breach); border-radius:6px; background:var(--breach-wash);
  padding:12px 13px;
}
.crash .hd{
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--breach); margin-bottom:5px;
}
.crash .msg{font-family:var(--mono); font-size:11px; color:var(--ice); line-height:1.6}
.empty{padding:16px; text-align:center; color:var(--dim); font-size:11.5px}

/* L5 — query anatomy */
.caret{color:var(--breach); font-weight:700}

/* intent vs. reality — the two readings of the same 84 characters */
.reading{margin-bottom:12px}
.reading .rh{
  display:flex; align-items:baseline; gap:8px; margin-bottom:5px;
  font-family:var(--mono); font-size:9.5px; font-weight:700;
  letter-spacing:.20em; text-transform:uppercase;
}
.reading .rh b{color:var(--ice); font-weight:700}
.reading .rh span{color:var(--dim); letter-spacing:.02em; text-transform:none; font-size:10.5px; font-weight:400}
.reading.intent .rh b{color:var(--ok)}
.reading.real .rh b{color:var(--taint)}

.ruler{
  display:flex; gap:0; margin-top:9px; height:6px; border-radius:3px; overflow:hidden;
  border:1px solid var(--rule);
}
.ruler i{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:6px 15px; margin-top:9px}
.legend span{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--dim)}
/* each swatch renders exactly as that category renders in the query above */
.legend i{width:14px; height:11px; border-radius:2px; display:block; flex:0 0 auto}
.legend i.s-lit{background:var(--ok); opacity:.85}
.legend i.s-syn{background:var(--taint)}
.legend i.s-data{background:var(--taint-wash); border:1px solid var(--taint-edge); border-bottom-width:2px}
.legend i.s-dead{background:var(--rule-2); position:relative}
.legend i.s-dead::after{
  content:""; position:absolute; left:1px; right:1px; top:50%; height:1px; background:var(--dim);
}
.tally{
  margin-top:7px; font-family:var(--mono); font-size:10px; letter-spacing:.02em;
  color:var(--dim); font-variant-numeric:tabular-nums;
}
.tally b{color:var(--taint); font-weight:600}

/* L6 — data */
table.db{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11px}
table.db caption{
  text-align:left; padding-bottom:5px; color:var(--dim);
  font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
}
table.db th{
  text-align:left; padding:4px 8px; color:var(--dim); font-weight:600;
  border-bottom:1px solid var(--rule-2); font-size:10px; letter-spacing:.10em; text-transform:uppercase;
}
table.db td{padding:4px 8px; border-bottom:1px solid var(--rule); color:var(--ice)}
table.db td:last-child{text-align:right; font-variant-numeric:tabular-nums}
table.db tr.got td{background:var(--taint-wash); color:var(--taint)}
table.db tr.locked td{color:var(--dim)}
table.db + table.db{margin-top:16px}

/* ── RIGHT: taint trace ────────────────────────────────────── */
.side{
  border-left:1px solid var(--rule); padding:14px 0 0;
  display:flex; flex-direction:column; min-height:0;
  background:color-mix(in srgb,var(--strata) 40%,transparent);
}
.trace{list-style:none; margin:0; padding:0 16px 14px; overflow-y:auto; min-height:0;
  display:flex; flex-direction:column;}
.step{position:relative; padding:0 0 15px 20px}
.step::before{
  content:""; position:absolute; left:3px; top:5px; width:7px; height:7px;
  border-radius:50%; border:1px solid var(--rule-2); background:var(--void);
}
.step::after{
  content:""; position:absolute; left:6px; top:14px; bottom:-1px; width:1px;
  background:var(--rule);
}
.step:last-child::after{display:none}
.step.on::before{border-color:var(--taint); background:var(--taint); box-shadow:0 0 0 3px var(--taint-wash)}
.step.crossed::before{border-color:var(--breach); background:var(--breach); box-shadow:0 0 0 3px var(--breach-wash)}
.step .sh{
  font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.18em;
  text-transform:uppercase; color:var(--dim); margin-bottom:2px;
}
.step.on .sh{color:var(--ice)}
.step .sb{font-size:11.5px; line-height:1.5; color:var(--dim)}
.step.on .sb{color:var(--ice)}
.step .sb em{font-style:normal; color:var(--taint); font-family:var(--mono); font-size:11px}
.step.crossed .sh{color:var(--breach)}
.step.crossed .sb strong{color:var(--breach); font-weight:600}

.verdict{
  margin-top:auto; border-top:1px solid var(--rule); padding:12px 16px;
  display:flex; flex-direction:column; gap:6px;
}
.vrow{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.vrow .k{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); font-family:var(--mono)}
.vrow .v{font-family:var(--mono); font-size:12px; color:var(--ink); font-variant-numeric:tabular-nums}
.vrow .v.bad{color:var(--breach)}
.vrow .v.hot{color:var(--taint)}
.vrow .v.good{color:var(--ok)}

/* ── BOTTOM CONSOLE ────────────────────────────────────────── */
.console{
  grid-column:1/-1; border-top:1px solid var(--rule);
  background:color-mix(in srgb,var(--strata) 72%,transparent);
  padding:11px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.console .lbl{color:var(--dim); flex:0 0 auto}
.presets{display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:220px}
.pre{
  padding:5px 9px; border:1px solid var(--rule-2); border-radius:4px;
  background:var(--void); color:var(--ice); cursor:pointer;
  font-family:var(--mono); font-size:11px; white-space:nowrap;
  transition:border-color .16s,color .16s;
}
.pre:hover{border-color:var(--taint); color:var(--taint)}
.pre.on{border-color:var(--taint); color:var(--taint); background:var(--taint-wash)}
.pre small{display:block; font-family:var(--sans); font-size:9.5px; color:var(--dim); letter-spacing:.04em; margin-top:1px}
.pre:hover small,.pre.on small{color:var(--ice)}

/* ── NOTES BELOW THE FOLD ──────────────────────────────────── */
.notes{
  max-width:78ch; margin:0 auto; padding:72px 24px 90px;
  border-top:1px solid var(--rule);
}
.notes h2{
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.26em;
  text-transform:uppercase; color:var(--signal); margin:0 0 8px;
}
.notes h3{
  font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.10em;
  color:var(--ink); margin:34px 0 8px; text-wrap:balance;
}
.notes p{color:var(--ice); margin:0 0 12px; line-height:1.65}
.notes p b{color:var(--ink); font-weight:600}
.notes .lede{font-size:16px; color:var(--ink); line-height:1.6; margin-bottom:26px; text-wrap:pretty}
.notes ul{color:var(--ice); padding-left:18px; margin:0 0 12px; line-height:1.7}
.notes li{margin-bottom:5px}
.notes li b{color:var(--ink); font-weight:600}
.notes code{
  font-size:12px; background:var(--strata); border:1px solid var(--rule);
  padding:1px 5px; border-radius:3px; color:var(--ice);
}
.swatches{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 4px}
.sw{flex:1 1 130px; border:1px solid var(--rule); border-radius:5px; overflow:hidden; background:var(--strata)}
.sw i{display:block; height:34px}
.sw div{padding:7px 9px}
.sw .n{font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ink)}
.sw .d{font-size:10.5px; color:var(--dim); margin-top:2px; line-height:1.4}


/* ── LAB PICKER + GOAL + SOLVE STATUS (added for the lab platform) ── */
.labwrap{position:relative; display:flex; align-items:center}
.labwrap::after{
  content:"▾"; position:absolute; right:9px; top:50%; transform:translateY(-50%);
  pointer-events:none; color:var(--dim); font-size:9px;
}
select.labsel{
  appearance:none; -webkit-appearance:none;
  font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.04em;
  color:var(--ink); background:var(--void);
  border:1px solid var(--rule-2); border-radius:5px;
  padding:6px 26px 6px 10px; cursor:pointer; max-width:340px;
}
select.labsel:hover{border-color:var(--signal)}
select.labsel optgroup{background:var(--strata); color:var(--dim); font-style:normal}
select.labsel option{background:var(--strata); color:var(--ink)}

.goalstrip{display:flex; align-items:center; gap:9px; min-width:0}
.goalstrip .lvl{
  font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--dim); border:1px solid var(--rule-2);
  padding:2px 6px; border-radius:3px; white-space:nowrap;
}
.goalstrip .g{font-size:12px; color:var(--ice); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.goalstrip .g b{color:var(--ink); font-weight:600}

.solve{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:4px 10px; border-radius:999px; border:1px solid var(--rule-2);
  font-family:var(--mono); font-size:10px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
}
.solve .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.solve.done{color:var(--ok); border-color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent)}

/* ── GENERIC CODE BLOCK (shared by XSS response/wire panels) ── */
.codebox{
  font-family:var(--mono); font-size:12px; line-height:1.85; word-break:break-word;
  padding:11px 12px; border:1px solid var(--rule); border-radius:5px; background:var(--void);
}
.codebox.bad{border-color:var(--breach)}
.codebox.dim{opacity:.55}
.tn.mk{background:var(--taint); color:var(--void); border-bottom-color:transparent}  /* markup the parser read as a tag */

/* ── BROWSER URL BAR (DOM-XSS source lives in the fragment) ── */
.urlbar{
  display:flex; align-items:stretch; border:1px solid var(--rule-2);
  border-radius:6px; overflow:hidden; background:var(--void); font-family:var(--mono); font-size:12px;
}
.urlbar .scheme{display:flex; align-items:center; gap:6px; padding:0 10px; color:var(--dim); background:color-mix(in srgb,var(--strata) 60%,transparent); border-right:1px solid var(--rule)}
.urlbar .path{display:flex; align-items:center; padding:8px 0 8px 10px; color:var(--ice); white-space:nowrap}
.urlbar .hash{color:var(--dim); padding:8px 2px}
.urlbar input{
  flex:1; min-width:60px; border:0; outline:none; background:transparent;
  color:var(--taint); font-family:var(--mono); font-size:12px; padding:8px 10px 8px 2px;
}
.urlbar .lockx{color:var(--ok); font-size:10px}
.fragnote{margin-top:7px; font-size:11px; color:var(--dim)}
.fragnote b{color:var(--ice)}

/* ── SOURCE → SINK annotation (DOM XSS) ── */
.srcsink{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:11px 0 2px}
.pin{
  display:inline-flex; align-items:center; gap:7px; padding:5px 10px; border-radius:5px;
  border:1px solid var(--taint-edge); background:var(--taint-wash); font-family:var(--mono); font-size:11px;
}
.pin .role{font-size:8.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
.pin code{color:var(--taint); font-family:var(--mono)}
.srcsink .flow{flex:1; min-width:24px; height:1px; background:repeating-linear-gradient(90deg,var(--taint-edge) 0 5px,transparent 5px 10px)}
.srcsink .arw{color:var(--taint)}

/* ── DOM TREE (the parser's output made visible) ── */
.tree{font-family:var(--mono); font-size:11.5px; line-height:1.75; padding:4px 2px}
.tree ul{list-style:none; margin:0; padding-left:16px; border-left:1px solid var(--rule)}
.tree > ul{border-left:0; padding-left:0}
.tree li{position:relative}
.tree .node{display:inline-flex; align-items:baseline; gap:8px; padding:1px 0}
.tree .el{color:var(--ice)}
.tree .el .nm{color:var(--signal)}
.tree .el.inj .nm{color:var(--taint)}
.tree .txt{color:var(--dim)}
.tree .txt::before{content:"“"} .tree .txt::after{content:"”"}
.tree .at{color:var(--dim)}
.tree .at.on{color:var(--taint)}
.tree .badge{
  font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  padding:1px 6px; border-radius:3px; border:1px solid currentColor;
}
.tree .badge.exec{color:var(--breach)}
.tree .badge.inert{color:var(--dim)}

/* ── WAF BLOCKLIST ── */
.waf{display:flex; flex-direction:column; gap:8px}
.waf .rulehdr{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.rulelist{display:flex; flex-direction:column; gap:5px}
.rule{
  display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:5px;
  border:1px solid var(--rule); background:var(--void); font-family:var(--mono); font-size:11.5px;
}
.rule .rx{color:var(--ice)}
.rule .hit{margin-left:auto; font-size:8.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.rule.matched{border-color:var(--breach); background:var(--breach-wash)}
.rule.matched .rx{color:var(--breach)}
.rule.matched .hit{color:var(--breach)}
.rule.clear .hit{color:var(--ok)}
.scanline{font-family:var(--mono); font-size:12px; line-height:1.9; padding:9px 11px; border:1px solid var(--rule); border-radius:5px; background:var(--void); word-break:break-word}
.scanline .bad{background:var(--breach); color:var(--void); border-radius:2px; padding:0 2px; font-weight:600}

/* ── VECTOR VERDICT ROWS ── */
.vecs{display:flex; flex-direction:column; gap:6px; margin-top:2px}
.vec{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px;
  padding:8px 11px; border:1px solid var(--rule); border-radius:6px; background:var(--void);
}
.vec code{font-family:var(--mono); font-size:11px; color:var(--ice)}
.vec .why{font-size:11px; color:var(--ice); line-height:1.4}
.vec .st{font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:3px; border:1px solid currentColor; white-space:nowrap}
.vec.fires{border-color:var(--breach)}
.vec.fires .st{color:var(--breach)}
.vec.inert .st{color:var(--dim)}
.vec.click .st{color:var(--signal)}

/* ── SIMULATED alert() + SOLVED BANNER (the payoff on L0) ── */
.applayer{position:relative}
.alertsim{
  position:absolute; inset:0; display:grid; place-items:center; z-index:5;
  background:color-mix(in srgb,var(--void) 62%,transparent); backdrop-filter:blur(1.5px);
}
.alertsim .box{
  width:min(340px,86%); border-radius:9px; overflow:hidden;
  border:1px solid var(--rule-2); background:var(--strata);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.alertsim .abar{
  padding:9px 13px; font-family:var(--mono); font-size:11px; color:var(--ice);
  border-bottom:1px solid var(--rule); background:color-mix(in srgb,var(--void) 40%,transparent);
}
.alertsim .amsg{padding:16px 15px; font-family:var(--mono); font-size:13px; color:var(--ink); word-break:break-word}
.alertsim .afoot{display:flex; justify-content:flex-end; padding:0 13px 13px}
.alertsim .ok{
  padding:5px 16px; border-radius:5px; border:1px solid var(--signal-deep);
  background:var(--signal-wash); color:var(--signal); font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
}
.solvebanner{
  display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:6px;
  border:1px solid var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent);
  color:var(--ok); font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.02em;
}
.solvebanner .tick{font-weight:700}

.blockpage{border:1px solid var(--breach); border-radius:6px; background:var(--breach-wash); padding:13px}
.blockpage .hd{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--breach); margin-bottom:5px}
.blockpage .msg{font-size:11.5px; color:var(--ice); line-height:1.55}

/* trace + callout states for the differing taint signatures */
.step.absent::before{border-color:var(--rule-2); background:var(--void)}
.step.absent .sh{color:var(--dim)}
.step.absent .sb{color:var(--dim); opacity:.8}
.step.sink::before{border-color:var(--taint); background:var(--taint); box-shadow:0 0 0 3px var(--taint-wash)}
.pcall.blocked .bc{color:var(--breach)}
.pcall.absent .bc{color:var(--dim)}
.plane.st-blocked{border-color:var(--breach)}

/* ══════════════════════════════════════════════════════════════
   L0 SURFACE — a real storefront in a browser window.
   Deliberately mundane and always-light: this is "the actual site",
   the honest contrast to the dark instrument beneath it. Self-contained
   light theme, real sans-serif, no amber, no monospace.
   ══════════════════════════════════════════════════════════════ */
.browserframe{
  --s-bg:#ffffff; --s-panel:#f4f6f8; --s-line:#e3e7ec; --s-line2:#d3d9e0;
  --s-ink:#1b1f27; --s-muted:#6a7280; --s-brand:#14171c;
  --s-accent:#2f6bff; --s-buy:#0d8a56; --s-danger:#c23b2f; --s-star:#f5a524;
  height:100%; display:flex; flex-direction:column; overflow:hidden;
  border-radius:8px; border:1px solid #cdd3da;
  background:var(--s-bg); color:var(--s-ink);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  box-shadow:0 18px 46px rgba(0,0,0,.35);
}
.bbar{
  flex:0 0 auto; display:flex; align-items:center; gap:11px; padding:8px 12px;
  background:linear-gradient(#eef1f4,#e6eaee); border-bottom:1px solid var(--s-line2);
}
.bbar .dots{display:flex; gap:6px}
.bbar .dots i{width:11px; height:11px; border-radius:50%; background:#d0d5db}
.bbar .dots i:nth-child(1){background:#f0625a} .bbar .dots i:nth-child(2){background:#f5bd4f} .bbar .dots i:nth-child(3){background:#5cc95c}
.bbar .addr{
  flex:1; display:flex; align-items:center; gap:7px; min-width:0;
  background:#fff; border:1px solid var(--s-line2); border-radius:999px; padding:5px 12px;
  font-size:12px; color:var(--s-ink);
}
.bbar .addr .lock{font-size:10px; opacity:.7}
.bbar .addr .url{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center}
.bbar .addr .frag{color:var(--s-muted)}
.bbar .addr input.fraginput{
  border:0; outline:none; background:#fff7ec; color:#b45309; font-family:var(--sans);
  font-size:12px; padding:1px 3px; min-width:80px; border-radius:3px;
}
.bbar .bmenu{color:var(--s-muted); font-weight:700}

.site{flex:1; overflow:auto; overscroll-behavior:contain; display:flex; flex-direction:column; background:var(--s-bg)}
.s-head{
  flex:0 0 auto; display:flex; align-items:center; gap:16px;
  padding:12px 18px; border-bottom:1px solid var(--s-line); background:var(--s-bg);
}
.s-logo{font-weight:800; letter-spacing:.22em; font-size:15px; color:var(--s-brand)}
.s-nav{display:flex; gap:15px}
.s-nav a{color:var(--s-muted); font-size:12.5px; cursor:pointer; text-decoration:none}
.s-nav a:hover{color:var(--s-ink)}
.s-search{margin-left:auto; display:flex; align-items:center; gap:0}
.s-search .s-q{
  width:210px; max-width:34vw; padding:8px 12px; font-family:var(--sans); font-size:13px;
  color:var(--s-ink); background:var(--s-panel);
  border:1px solid var(--s-line2); border-right:0; border-radius:7px 0 0 7px; outline:none;
}
.s-search .s-q::placeholder{color:var(--s-muted)}
.s-search .s-q:focus{background:#fff; border-color:var(--s-accent)}
.s-search .s-go{
  padding:8px 14px; border:1px solid var(--s-accent); background:var(--s-accent); color:#fff;
  font-family:var(--sans); font-size:12.5px; font-weight:600; border-radius:0 7px 7px 0; cursor:pointer;
}
.s-search .s-go:hover{filter:brightness(1.06)}
.s-search .s-q:disabled,.s-search .s-go:disabled{opacity:.55; cursor:default}
.s-cart{color:var(--s-ink); font-size:16px; position:relative; cursor:pointer}
.s-cart sup{font-size:9px; color:#fff; background:var(--s-accent); border-radius:999px; padding:0 4px; position:relative; top:-6px; left:-3px}

.s-main{flex:1; padding:18px}
.s-h{font-size:19px; font-weight:700; color:var(--s-ink); margin:0 0 3px; letter-spacing:-.01em}
.s-reflect{background:rgba(255,162,74,.16); border-radius:2px; padding:0 1px}   /* where your input landed */
.s-sub{color:var(--s-muted); font-size:12.5px; margin:0 0 16px}
.s-empty{color:var(--s-muted); font-size:13px; margin:2px 0 18px}

.s-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.s-card{
  border:1px solid var(--s-line); border-radius:9px; overflow:hidden; background:var(--s-bg);
  display:flex; flex-direction:column; transition:box-shadow .15s, transform .15s;
}
.s-card:hover{box-shadow:0 8px 22px rgba(20,30,50,.12); transform:translateY(-2px)}
.s-photo{
  aspect-ratio:4/3; position:relative; display:grid; place-items:center;
  background:linear-gradient(135deg,#dfe6ee,#eef2f6);
}
.s-photo::after{content:""; width:34%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fbfdff 0 12%,#9fb2c4 42%,#5f7488 72%,#41505f 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.15)}
.s-photo .htag{position:absolute; top:8px; left:8px; font-size:9px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:2px 6px; border-radius:4px; background:#111; color:#fff; opacity:.82}
.s-pbody{padding:10px 11px 12px; display:flex; flex-direction:column; gap:4px}
.s-name{font-size:12.5px; font-weight:600; color:var(--s-ink); line-height:1.3}
.s-rate{font-size:10px; color:var(--s-star); letter-spacing:1px}
.s-rate small{color:var(--s-muted); letter-spacing:0; margin-left:3px}
.s-priceline{display:flex; align-items:center; justify-content:space-between; margin-top:3px}
.s-price{font-size:14px; font-weight:700; color:var(--s-ink)}
.s-add{border:1px solid var(--s-line2); background:var(--s-panel); color:var(--s-ink);
  font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px; cursor:pointer; font-family:var(--sans)}
.s-add:hover{border-color:var(--s-accent); color:var(--s-accent)}
.s-card.leaked{border-color:#e7b7b0; background:#fdf3f2}
.s-card.leaked .s-photo{background:linear-gradient(135deg,#f6dcd8,#fbeceb)}
.s-card.leaked .s-photo::after{background:none; box-shadow:none; width:auto; content:"⚠"; font-size:26px; color:#c23b2f}
.s-card.leaked .s-name{color:#8a2b22; font-family:var(--mono); font-size:11px; word-break:break-all}
.s-card.leaked .s-price{font-family:var(--mono); font-size:11px; color:#8a2b22}
.s-leaktag{font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#c23b2f}

/* SQLi surface DB error — a vulnerable app leaking its stack to the page */
.s-err{border:1px solid #e7b7b0; border-radius:9px; background:#fdf3f2; padding:15px 16px; margin-top:2px}
.s-err h1{font-size:16px; color:#8a2b22; margin:0 0 6px}
.s-err p{color:var(--s-muted); font-size:12.5px; margin:0 0 10px}
.s-err pre{margin:0; font-family:var(--mono); font-size:11px; color:#8a2b22; background:#fbe9e7;
  border:1px solid #f0ccc7; border-radius:6px; padding:9px 11px; white-space:pre-wrap; word-break:break-word}

/* DOM lab — product detail + recently-viewed widget */
.s-product{display:grid; grid-template-columns:200px 1fr; gap:20px; align-items:start}
.s-product .s-photo{aspect-ratio:1; border-radius:10px; border:1px solid var(--s-line)}
.s-pinfo h1{font-size:20px; margin:0 0 2px; color:var(--s-ink)}
.s-pinfo .s-brandline{color:var(--s-muted); font-size:12px; margin-bottom:10px}
.s-pinfo .s-price{font-size:22px; margin:6px 0 4px}
.s-pinfo .s-stock{color:var(--s-buy); font-size:12px; font-weight:600; margin-bottom:14px}
.s-pinfo p.s-desc{color:#4b5563; font-size:12.5px; line-height:1.6; margin:0 0 16px; max-width:52ch}
.s-buy{padding:10px 20px; border:0; border-radius:8px; background:var(--s-buy); color:#fff;
  font-family:var(--sans); font-size:13px; font-weight:700; cursor:pointer}
.s-buy:hover{filter:brightness(1.05)}
.s-recent{margin-top:26px; border-top:1px solid var(--s-line); padding-top:16px}
.s-recent h2{font-size:13px; color:var(--s-muted); font-weight:600; letter-spacing:.02em; margin:0 0 9px; text-transform:uppercase}
.s-recentbody{font-size:14px; color:var(--s-ink); min-height:22px}
.brokenimg{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border:1px dashed var(--s-line2); border-radius:3px; font-size:11px; vertical-align:middle; filter:grayscale(1); opacity:.7}

/* realistic browser alert() dialog (light) */
.alertsim{position:absolute; inset:0; display:grid; place-items:start center; padding-top:8%;
  z-index:6; background:rgba(20,26,34,.28); backdrop-filter:blur(1px)}
.alertsim .box{width:min(360px,84%); border-radius:11px; overflow:hidden; background:#fbfcfd;
  border:1px solid #cdd3da; box-shadow:0 24px 60px rgba(0,0,0,.4); font-family:var(--sans)}
.alertsim .abar{padding:13px 16px 4px; font-size:13px; font-weight:600; color:#1b1f27}
.alertsim .amsg{padding:2px 16px 16px; font-size:13px; color:#374151; word-break:break-word}
.alertsim .afoot{display:flex; justify-content:flex-end; gap:8px; padding:0 14px 14px; background:transparent}
.alertsim .ok{cursor:pointer; padding:7px 20px; border-radius:7px; border:0; background:#2f6bff; color:#fff;
  font-family:var(--sans); font-size:12.5px; font-weight:600; letter-spacing:0; text-transform:none; cursor:pointer}

/* realistic WAF/CDN block page (light) */
.blockpage{border:1px solid var(--s-line); border-radius:10px; background:var(--s-panel);
  padding:26px 22px; text-align:center; margin:8px auto; max-width:440px}
.blockpage .hd{font-family:var(--sans); font-size:16px; font-weight:700; letter-spacing:0;
  text-transform:none; color:#c23b2f; margin-bottom:8px}
.blockpage .msg{font-size:12.5px; color:#4b5563; line-height:1.6}
.blockpage .msg b{color:#1b1f27}
.blockpage .ref{margin-top:12px; font-family:var(--mono); font-size:10.5px; color:var(--s-muted)}

/* ══════════════════════════════════════════════════════════════
   HOME — the lab catalog. The front door, for a beginner. Explains the
   concept, then lists labs as a learning path with a per-lab preview of
   which layers matter (the "signature" strip).
   ══════════════════════════════════════════════════════════════ */
.home{display:block; min-height:100svh; background:
  radial-gradient(1100px 700px at 50% -8%, var(--signal-wash), transparent 62%), var(--void);}
.home[hidden]{display:none}   /* author rule must re-honor the hidden attribute */
.home-inner{max-width:1080px; margin:0 auto; padding:56px 28px 90px}
.hero{max-width:760px; margin-bottom:44px}
.hero-mark{font-family:var(--mono); font-weight:700; letter-spacing:.34em; font-size:15px; color:var(--signal); margin-bottom:22px}
.hero-h{font-size:clamp(26px,4vw,40px); line-height:1.12; font-weight:700; color:var(--ink); margin:0 0 16px; text-wrap:balance; letter-spacing:-.015em}
.hero-h em{font-style:normal; color:var(--signal)}
.hero-sub{font-size:15.5px; line-height:1.62; color:var(--ice); margin:0; max-width:65ch}
.hero-sub b{color:var(--ink); font-weight:600}

.track{margin-bottom:34px}
.track-h{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
  color:var(--dim); margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--rule)}
.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:15px}

.labcard{
  text-align:left; cursor:pointer; font:inherit; color:inherit;
  display:flex; flex-direction:column; gap:9px; min-height:172px;
  padding:16px 17px 14px; border-radius:11px;
  border:1px solid var(--rule); background:
    linear-gradient(180deg, color-mix(in srgb,var(--raise) 92%,transparent), var(--strata));
  transition:border-color .16s, transform .16s, box-shadow .16s;
}
.labcard:hover{border-color:var(--signal-deep); transform:translateY(-3px); box-shadow:0 16px 40px rgba(0,0,0,.4)}
.labcard:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
.lc-top{display:flex; align-items:center; gap:9px}
.lc-code{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--signal)}
.lc-diff{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); border:1px solid var(--rule-2); padding:2px 6px; border-radius:3px}
.startchip{margin-left:auto; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--void); background:var(--signal); padding:2px 7px; border-radius:3px}
.lc-title{font-size:16px; font-weight:650; color:var(--ink); line-height:1.24; letter-spacing:-.01em}
.lc-blurb{font-size:12.5px; line-height:1.5; color:var(--ice); flex:1}
.lc-blurb code{font-family:var(--mono); font-size:11px; color:var(--taint)}
.lc-strip{display:flex; align-items:center; gap:11px; margin-top:4px}
.sig{display:flex; gap:3px; flex:1}
.sig i{height:6px; flex:1; border-radius:2px; background:var(--rule-2)}
.sig i.sg-a{background:var(--taint)}                 /* your input, active here */
.sig i.sg-x{background:var(--breach)}                /* the weak spot */
.sig i.sg-d{background:var(--rule-2); opacity:.5}    /* payload absent here */
.sig i.sg-s{background:var(--signal)}                /* safe / all-good */
.lc-go{font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap}
.labcard:hover .lc-go{color:var(--signal)}
.home-foot{margin-top:26px; font-size:11.5px; color:var(--dim); text-align:center; font-family:var(--mono); letter-spacing:.02em}

.homebtn{
  flex:0 0 auto; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em;
  color:var(--ice); background:transparent; border:1px solid var(--rule-2); border-radius:6px;
  padding:6px 11px; cursor:pointer; transition:border-color .16s, color .16s;
}
.homebtn:hover{border-color:var(--signal); color:var(--ink)}

/* Foundations: a guided tour, not an attack */
.solve.tour{color:var(--signal); border-color:var(--signal-deep); background:var(--signal-wash)}
.membrane.safe{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 8%,transparent)}
.membrane.safe span{color:var(--ok)}
.boundary.safe{color:var(--ok)}
.boundary.safe::after{background:repeating-linear-gradient(90deg,var(--ok) 0 4px,transparent 4px 8px)}

/* beginner explainer block used across the Foundations layers */
.explain{border:1px solid var(--rule); border-left:2px solid var(--signal); border-radius:0 7px 7px 0;
  background:var(--signal-wash); padding:11px 14px; margin-bottom:14px}
.explain .ex-q{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--signal); margin-bottom:5px}
.explain .ex-b{font-size:13px; line-height:1.62; color:var(--ice)}
.explain .ex-b b{color:var(--ink); font-weight:600}
.explain .ex-b code{font-family:var(--mono); font-size:12px; color:var(--taint)}
.tourbar{display:flex; align-items:center; gap:9px; margin-bottom:12px; padding:8px 12px; border-radius:7px;
  background:var(--signal-wash); border:1px solid var(--rule); font-size:12px; color:var(--ice)}
.tourbar b{color:var(--ink); font-weight:600}
.tourbar kbd{margin:0 1px}

/* neutral DOM/data tree for Foundations (no injection colouring) */
.ntree{font-family:var(--mono); font-size:11.5px; line-height:1.7}
.ntree ul{list-style:none; margin:0; padding-left:15px; border-left:1px solid var(--rule)}
.ntree > ul{border-left:0; padding-left:0}
.ntree .t{color:var(--ice)} .ntree .t .n{color:var(--signal)}
.ntree .x{color:var(--dim)}
.ntree .a{color:var(--dim)}

/* ══════════════════════════════════════════════════════════════
   OWASP LAB SURFACE WIDGETS (all inside the light .browserframe /.site)
   ══════════════════════════════════════════════════════════════ */
.minirow{display:flex; align-items:center; gap:8px; margin:12px 0 2px}
.minirow label{font-size:12px; font-weight:600; color:var(--s-ink,#1b1f27); white-space:nowrap}
.minirow .s-q{flex:1; min-width:80px; border-radius:7px; border:1px solid var(--s-line2,#d3d9e0)!important}
.minirow .s-go{border-radius:7px}

.kv{display:flex; flex-direction:column; gap:1px; border:1px solid var(--s-line,#e3e7ec); border-radius:8px; overflow:hidden}
.kvr{display:grid; grid-template-columns:150px 1fr; gap:12px; padding:8px 12px; background:var(--s-bg,#fff)}
.kvr:nth-child(even){background:var(--s-panel,#f4f6f8)}
.kk{font-size:11.5px; color:var(--s-muted,#6a7280); font-weight:600}
.vv{font-size:12.5px; color:var(--s-ink,#1b1f27); font-family:var(--mono); word-break:break-word}
.vv.leak{color:#b45309; font-weight:600}
.vv.bad{color:#c23b2f; font-weight:600}
.vv.ok{color:#0d8a56}
.vv .plain,.plain{color:#0d8a56; font-weight:700}

.ownerbad,.ownerok,.loginerr,.imgok{font-size:12.5px; line-height:1.55; padding:10px 12px; border-radius:8px}
.ownerbad{background:#fdf3f2; border:1px solid #e7b7b0; color:#8a2b22}
.ownerbad b{color:#7a2018}
.ownerok{background:#eef7f1; border:1px solid #bfe0cc; color:#1a6b40}
.loginerr{background:#fdf6ec; border:1px solid #eccf9a; color:#8a5a12}
.loginerr .enum{color:#b45309; font-family:var(--mono); font-size:11px}
.mono{font-family:var(--mono)}

.cracked{background:#fdf3f2; border:1px solid #e7b7b0; border-radius:8px; padding:11px 13px; font-size:13px; color:#8a2b22}
.cracked .plain{font-size:15px}

.cartline{display:flex; align-items:center; gap:13px; padding:12px 0; border-bottom:1px solid var(--s-line,#e3e7ec); margin-bottom:6px}
.cartpic{width:56px; height:56px; border-radius:8px; flex:0 0 auto}
.receipt{margin-top:14px; border:1px solid var(--s-line,#e3e7ec); border-radius:9px; padding:13px 15px; background:var(--s-panel,#f4f6f8)}
.receipt.win{border-color:#e7b7b0; background:#fdf3f2}
.receipt .rrow{display:flex; justify-content:space-between; font-size:15px; margin-bottom:4px}
.receipt .rrow b{font-size:17px}
.receipt.win .rrow b{color:#c23b2f}
.receipt .rmsg{font-size:12px; color:var(--s-muted,#6a7280)}

.leakfile{margin:8px 0 0; font-family:var(--mono); font-size:11.5px; line-height:1.6; color:#1b1f27;
  background:#0f1620; color:#cfe3ef; border-radius:8px; padding:12px 14px; white-space:pre-wrap; word-break:break-word;
  border:1px solid #22303c}
.pathinput{flex:1; border:0!important; outline:none; background:#fff7ec!important; color:#b45309!important;
  font-family:var(--mono); font-size:12px; padding:2px 6px; border-radius:3px}

.depscan,.attempts,.logv,.socgrid{margin-top:8px}
.dep{display:grid; grid-template-columns:110px 62px 1fr auto; gap:10px; align-items:center; padding:7px 11px;
  border:1px solid var(--s-line,#e3e7ec); border-radius:6px; font-family:var(--mono); font-size:11.5px; background:var(--s-bg,#fff); margin-bottom:5px}
.dep .dn{font-weight:700; color:#1b1f27} .dep .dv{color:#6a7280}
.dep .dadv{color:#6a7280; font-family:var(--sans); font-size:11px}
.dep .dstat{font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:3px; border:1px solid currentColor; white-space:nowrap}
.dep.bad{border-color:#e7b7b0; background:#fdf3f2}
.dep.bad .dn{color:#8a2b22} .dep.bad .dadv{color:#8a2b22} .dep.bad .dstat{color:#c23b2f}
.dep.ok .dstat{color:#0d8a56}
.biopreview{margin-top:14px; border:1px solid var(--s-line,#e3e7ec); border-radius:9px; padding:12px 14px; background:var(--s-panel,#f4f6f8)}
.biopreview .s-recentbody h3{font-size:15px; margin:2px 0}

.attempts .att{font-family:var(--mono); font-size:11px; color:#6a7280; padding:1px 0}
.attempts .att.miss{color:#b9704f} .attempts .att.hit{color:#0d8a56; font-weight:700}

.jwt{font-family:var(--mono); font-size:12px; word-break:break-all; padding:11px 12px; border-radius:8px;
  background:#0f1620; border:1px solid #22303c; margin:10px 0}
.jwt .jh{color:#e05a86} .jwt .jp{color:#c98a2a} .jwt .js{color:#4aa3c7} .jwt .jdot{color:#5a7286}
.jwtdec{display:flex; flex-direction:column; gap:2px; margin-bottom:6px}
.jrow{display:grid; grid-template-columns:80px 1fr; gap:10px; font-size:11.5px; align-items:baseline}
.jrow>span{color:var(--s-muted,#6a7280); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em}
.jrow code{font-family:var(--mono); font-size:11.5px; color:#1b1f27; word-break:break-all}
.jrow code .rl{color:#c23b2f}

.socgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:12px}
.soctile{border:1px solid var(--s-line,#e3e7ec); border-radius:9px; padding:12px 13px; background:var(--s-bg,#fff)}
.soch{font-size:10.5px; color:var(--s-muted,#6a7280); font-weight:600; letter-spacing:.02em; text-transform:uppercase; margin-bottom:6px}
.socn{font-size:24px; font-weight:700; color:#1b1f27; font-variant-numeric:tabular-nums}
.socn.bad{color:#c23b2f}
.logv .logrow{font-family:var(--mono); font-size:11.5px; color:#1b1f27; padding:5px 10px; background:#f4f6f8; border-radius:5px; margin-bottom:4px}
.logv .logrow.dim{color:#9aa3ad; font-style:italic}

/* ── OBJECTIVES (the challenge ladder in the side rail) ────── */
.objs{padding:0 16px 12px; border-bottom:1px solid var(--rule); margin-bottom:10px;
  display:flex; flex-direction:column; gap:7px}
.objs h2{margin:0 0 2px; padding:0}
.obj{display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:8px; align-items:start;
  font-size:11.5px; position:relative}
.obj .od{width:11px; height:11px; border:1px solid var(--rule-2); border-radius:50%;
  margin-top:3px; background:var(--void); transition:background .2s, border-color .2s}
.obj.done .od{background:var(--ok); border-color:var(--ok)}
.obj.done .od::after{content:"✓"; color:var(--void); font-size:8px; font-weight:700;
  display:grid; place-items:center; margin-top:1px}
.obj .ol{color:var(--ice); line-height:1.45}
.obj.done .ol{color:var(--dim)}
.ohb{font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; border:1px solid var(--rule-2); background:transparent;
  color:var(--dim); border-radius:3px; padding:2px 7px; cursor:pointer; white-space:nowrap;
  transition:border-color .15s, color .15s}
.ohb:hover{border-color:var(--taint); color:var(--taint)}
.olad{grid-column:1/-1; margin:2px 0 4px 22px; padding:7px 10px;
  border-left:2px solid var(--taint); background:var(--taint-wash); border-radius:0 4px 4px 0;
  font-size:11px; line-height:1.5; color:var(--ice)}
.olad code, .orv code{color:var(--taint); font-family:var(--mono); font-size:10.5px; word-break:break-all}
.orv{margin-top:5px}
.orb{margin-top:6px; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; border:1px solid var(--taint-edge); background:var(--taint-wash);
  color:var(--taint); border-radius:3px; padding:3px 9px; cursor:pointer}
.orb:hover{background:var(--taint); color:var(--void)}

/* ── VIRTUAL INTERCEPT (Burp-style, scoped to the lab's request) ── */
.ixwrap{position:fixed; inset:0; z-index:80; display:grid; place-items:center;
  background:color-mix(in srgb, var(--void) 66%, transparent); backdrop-filter:blur(2px)}
.ixwrap[hidden]{display:none}
.ixpanel{width:min(640px, 92vw); border-radius:10px; overflow:hidden;
  border:1px solid var(--rule-2); background:var(--strata); box-shadow:0 34px 90px rgba(0,0,0,.55);
  display:flex; flex-direction:column}
.ixhead{display:flex; align-items:center; gap:10px; padding:9px 13px;
  border-bottom:1px solid var(--rule); background:color-mix(in srgb,var(--void) 40%,transparent)}
.ixhead .callout{color:var(--taint)}
.ixhead .ixx{margin-left:auto; background:none; border:0; color:var(--dim); font-size:14px; cursor:pointer}
.ixhead .ixx:hover{color:var(--ink)}
.ixraw{margin:12px; min-height:180px; resize:vertical; font-family:var(--mono); font-size:12px;
  line-height:1.7; color:var(--ice); background:var(--void); border:1px solid var(--rule-2);
  border-radius:6px; padding:11px 13px; outline:none; white-space:pre; tab-size:2}
.ixraw:focus{border-color:var(--taint); box-shadow:0 0 0 3px var(--taint-wash)}
.ixfoot{display:flex; align-items:center; gap:12px; padding:0 13px 13px}
.ixerr{font-family:var(--mono); font-size:10.5px; color:var(--breach); flex:1; min-width:0}
.ixsend{padding:7px 18px; border-radius:6px; border:1px solid var(--signal-deep);
  background:var(--signal-wash); color:var(--signal); font-family:var(--mono); font-size:11px;
  font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer}
.ixsend:hover{background:color-mix(in srgb,var(--signal) 18%,transparent)}

/* ── TOASTS + PERF HUD ──────────────────────────────────────── */
#toasts{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:90;
  display:flex; flex-direction:column; gap:7px; align-items:center; pointer-events:none}
.toastmsg{padding:8px 15px; border-radius:7px; border:1px solid var(--ok);
  background:color-mix(in srgb, var(--strata) 88%, transparent); color:var(--ok);
  font-family:var(--mono); font-size:11px; letter-spacing:.02em;
  box-shadow:0 14px 40px rgba(0,0,0,.4); animation:toastin .22s ease}
@keyframes toastin{from{opacity:0; transform:translateY(8px)} to{opacity:1}}
#perf{position:fixed; right:10px; bottom:10px; z-index:90; pointer-events:none;
  font-family:var(--mono); font-size:10px; color:var(--dim); background:var(--void);
  border:1px solid var(--rule); border-radius:5px; padding:4px 8px;
  font-variant-numeric:tabular-nums}

/* ── EXPLANATION POPUP (per-lab, bottom-right button) ───────── */
.fab{
  position:fixed; right:18px; bottom:18px; z-index:60;
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px; border-radius:999px; cursor:pointer;
  border:1px solid var(--rule-2); background:color-mix(in srgb, var(--strata) 88%, transparent);
  color:var(--ice); font-family:var(--mono); font-size:10.5px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
  box-shadow:0 14px 40px rgba(0,0,0,.4);
  transition:border-color .16s, color .16s;
}
.fab:hover{border-color:var(--signal); color:var(--ink)}
.fab[hidden]{display:none}
.exwrap{position:fixed; inset:0; z-index:70; display:grid; place-items:center;
  background:color-mix(in srgb, var(--void) 66%, transparent); backdrop-filter:blur(2px)}
.exwrap[hidden]{display:none}
.explainbox{width:min(620px,92vw); max-height:76vh; display:flex; flex-direction:column;
  border-radius:12px; overflow:hidden; border:1px solid var(--signal-deep);
  background:var(--strata); box-shadow:0 34px 90px rgba(0,0,0,.55)}
.exhead{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:13px 16px; border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--void) 40%,transparent)}
.exhead .callout{color:var(--signal)}
.exttl{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink); margin-left:8px}
.exx{background:none; border:0; color:var(--dim); font-size:14px; cursor:pointer}
.exx:hover{color:var(--ink)}
.exbody{padding:16px 18px 20px; overflow-y:auto; font-size:13.5px; line-height:1.65; color:var(--ice)}
.exbody b{color:var(--ink)}
.exbody code{font-family:var(--mono); font-size:12px;
  background:var(--void); border:1px solid var(--rule); border-radius:3px; padding:1px 5px; color:var(--ice)}

/* ── ANSWER PRESETS + SHOW-RESPONSE TOGGLE ─────────────────── */
.pre.answer{border-color:var(--taint-edge)}
.pre.answer span{color:var(--taint)}
.pre.answer small{color:var(--taint)}
.pre.showresp{border-style:dashed; color:var(--dim); background:transparent}
.pre.showresp:hover{border-color:var(--taint); color:var(--taint)}

/* ── the lab owns the viewport: no page scroll fighting the planes ── */
@media (min-width:941px){ body.in-lab{overflow:hidden} }
.home .notes{padding:56px 0 20px}
#perf{bottom:64px}

/* ── LOAD-LAB CARD + VALIDATOR MODAL ────────────────────────── */
.labcard.addlab{border-style:dashed; align-items:flex-start; justify-content:center}
.labcard.addlab .lc-title{color:var(--ice)}
.labcard.addlab:hover .lc-title{color:var(--ink)}
.labcard.addlab a{color:var(--signal); text-decoration:none}
.labcard.addlab a:hover{text-decoration:underline}
.modalwrap{position:fixed; inset:0; z-index:85; display:grid; place-items:center;
  background:color-mix(in srgb, var(--void) 66%, transparent)}
.modalwrap[hidden]{display:none}
.modalbox{width:min(560px,92vw); max-height:76vh; overflow:auto; border-radius:10px;
  border:1px solid var(--breach); background:var(--strata); padding:16px 18px;
  box-shadow:0 34px 90px rgba(0,0,0,.55)}
.modalbox h3{margin:0 0 4px; font-family:var(--mono); font-size:12px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--breach)}

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════
   STRATA — multi-lab engine.
   A lab is data: layers, presets, a pure analyze(payload), per-layer
   renderers, a taint signature, and a solved() check. The shell (stage,
   cross-section, trace, console) is lab-agnostic and reads the active lab.
   ════════════════════════════════════════════════════════════════════ */

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const clip = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;

const codeLines = lines => lines.map((l, i) =>
  `<span class="${l.hot ? "hot" : ""}"><span class="ln">${i + 1}</span>${l.t}</span>`
).join("\n");

const note = (kind, callout, html) =>
  `<div class="note ${kind}"><span class="callout">${callout}</span>${html}</div>`;

/* Beginner explainer block, used by the Foundations lab. */
const explain = (q, html) =>
  `<div class="explain"><div class="ex-q">${q}</div><div class="ex-b">${html}</div></div>`;

/* ══ SHARED INFRASTRUCTURE ═══════════════════════════════════════════ */

/* Small bounded memo for expensive pure string→string work (DOMParser
   helpers). A Map, capped, because payloads repeat across re-renders. */
function memoFn(fn, cap = 32){
  const m = new Map();
  return s => {
    if (m.has(s)) return m.get(s);
    const out = fn(s);
    m.set(s, out);
    if (m.size > cap) m.delete(m.keys().next().value);
    return out;
  };
}

function toast(msg){
  const host = document.getElementById("toasts");
  if (!host) return;
  const t = document.createElement("div");
  t.className = "toastmsg"; t.textContent = msg;
  host.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

/* ── Real MD5 (RFC 1321) — the A02 lab hashes a real wordlist at runtime,
   so "crack the hash" is actual math, not a lookup of three magic strings.
   K constants are derived from sin(), exactly as specified. ───────── */
const _md5K = Array.from({length:64}, (_, i) => Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296));
const _md5S = [].concat(
  Array(4).fill([7,12,17,22]).flat(),
  Array(4).fill([5,9,14,20]).flat(),
  Array(4).fill([4,11,16,23]).flat(),
  Array(4).fill([6,10,15,21]).flat()
);
function md5(str){
  const rl = (x,c) => (x << c) | (x >>> (32 - c));
  const au = (x,y) => { const l = (x & 0xFFFF) + (y & 0xFFFF), m = (x >> 16) + (y >> 16) + (l >> 16); return (m << 16) | (l & 0xFFFF); };
  const bytes = [...new TextEncoder().encode(str)];
  const blen = bytes.length;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const bits = blen * 8;
  for (let i = 0; i < 4; i++) bytes.push((bits / Math.pow(256, i)) & 0xFF);
  bytes.push(0,0,0,0);
  let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
  for (let off = 0; off < bytes.length; off += 64){
    const M = [];
    for (let j = 0; j < 16; j++)
      M[j] = (bytes[off+j*4]) | (bytes[off+j*4+1] << 8) | (bytes[off+j*4+2] << 16) | (bytes[off+j*4+3] << 24);
    let A = a, B = b, C = c, D = d;
    for (let r = 0; r < 64; r++){
      let f, x;
      if (r < 16){ f = (B & C) | (~B & D); x = r; }
      else if (r < 32){ f = (D & B) | (~D & C); x = (5*r + 1) % 16; }
      else if (r < 48){ f = B ^ C ^ D; x = (3*r + 5) % 16; }
      else { f = C ^ (B | ~D); x = (7*r) % 16; }
      const t = au(rl(au(au(A, f), au(_md5K[r], M[x])), _md5S[r]), B);
      A = D; D = C; C = B; B = t;
    }
    a = au(a,A); b = au(b,B); c = au(c,C); d = au(d,D);
  }
  const hx = n => { let s = ""; for (let i = 0; i < 4; i++) s += ((n >>> (8*i)) & 0xFF).toString(16).padStart(2,"0"); return s; };
  return hx(a) + hx(b) + hx(c) + hx(d);
}

/* The wordlist an attacker (and this lab) uses. Hashed at load, once. */
const WORDLIST = [...new Set([
  "123456","password","123456789","12345678","1234567","12345","qwerty","qwerty123","abc123",
  "000000","111111","123123","121212","654321","666666","888888","159753","1q2w3e","1qaz2wsx",
  "qwe123","123qwe","a123456","123abc","7777777","qwertyuiop","asdfghjkl","zxcvbnm","iloveyou",
  "monkey","dragon","sunshine","princess","football","baseball","letmein","welcome","admin",
  "admin123","password1","p@ssw0rd","root","toor","pass","pass123","test","test123","guest",
  "user","summer","winter","spring","autumn","chocolate","cookie","flower","angel","devil",
  "love","secret","master","freedom","whatever","trustno1","ninja","mustang","matrix","pokemon",
  "starwars","batman","superman","michael","jordan","jordan23","hunter2","shadow","kitten",
  "liverpool","chelsea","arsenal","barcelona","myspace1","1q2w3e4r","1234qwer","blink182",
  "randall","thunder","tigger","purple","ferrari","buster","soccer","harley","ranger","bubble"
])];
const RAINBOW = new Map(WORDLIST.map(w => [md5(w), w]));

/* ── Perf HUD (dev only — add ?perf to the URL) ───────────────────── */
const PERF = typeof location !== "undefined" && new URLSearchParams(location.search).has("perf");
const perfEl = PERF ? Object.assign(document.createElement("div"), { id:"perf" }) : null;
if (perfEl) document.body.appendChild(perfEl);
const perfN = { analyze:0, paint:0, layout:0, dirty:0 };
function perfShow(){
  if (!perfEl) return;
  perfEl.textContent =
    `analyze ${perfN.analyze.toFixed(2)}ms · paint ${perfN.paint.toFixed(2)}ms · ` +
    `layout ${perfN.layout.toFixed(2)}ms · planes pending ${perfN.dirty}`;
}

/* ── Layout tokens: read the CSS custom properties ONCE per resize,
   not on every layout() call. ─────────────────────────────────────── */
const TOK = { gap:190, gapx:96, fan:44, tiltx:"48deg", spinx:"-16deg", zoomx:.72 };
function readTokens(){
  const cs = getComputedStyle(document.documentElement);
  TOK.gap  = parseFloat(cs.getPropertyValue("--gap"));
  TOK.gapx = parseFloat(cs.getPropertyValue("--gapx"));
  TOK.fan  = parseFloat(cs.getPropertyValue("--fan"));
  TOK.tiltx = cs.getPropertyValue("--tiltx").trim() || "48deg";
  TOK.spinx = cs.getPropertyValue("--spinx").trim() || "-16deg";
  TOK.zoomx = parseFloat(cs.getPropertyValue("--zoomx")) || .72;
}

/* ── Persistent progress (objectives, hints used, solves) ─────────── */
const STORE_KEY = "strata.progress.v1";
let PROGRESS = Object.create(null);
try {
  const stored = JSON.parse(localStorage.getItem(STORE_KEY));
  if (stored && typeof stored === "object") PROGRESS = Object.assign(Object.create(null), stored);
} catch(_){ PROGRESS = Object.create(null); }
function saveProg(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(PROGRESS)); } catch(_){} }
function progFor(id){ return (PROGRESS[id] ??= { steps:{}, hints:{}, solved:false, solvedWithHelp:false }); }
function labUnlocked(lab){ const p = PROGRESS[lab.id]; return !!(p && (p.solved || p.solvedWithHelp)); }

/* ══ SHARED TAINT RENDERERS ═════════════════════════════════════════ */
/* Amber marks the student's bytes at every depth. Two intensities:
   .tn = data (a value), .tn.syn / .tn.mk = bytes a parser promoted to
   syntax (SQL) or markup (HTML) — the moment the lab turns on. */
function taint(s, cls = "tn"){ return s ? `<span class="${cls}">${esc(s)}</span>` : ""; }

/* Tokenise an HTML fragment into tag-structure vs text and colour each:
   a run inside < > is markup the parser read as a tag (amber-solid);
   text between tags stayed data (amber-wash). Pure string → safe spans,
   the payload is never inserted as live HTML. */
function taintMarkup(frag){
  let out = "", i = 0;
  while (i < frag.length){
    if (frag[i] === "<"){
      let j = frag.indexOf(">", i);
      if (j === -1) j = frag.length; else j += 1;
      out += `<span class="tn mk">${esc(frag.slice(i, j))}</span>`;
      i = j;
    } else {
      let j = frag.indexOf("<", i);
      if (j === -1) j = frag.length;
      out += `<span class="tn">${esc(frag.slice(i, j))}</span>`;
      i = j;
    }
  }
  return out;
}

/* ══ XSS EXECUTION ENGINE ═══════════════════════════════════════════
   Honest, focused analysis for HTML-text reflection context. Decides,
   for a real payload, whether an auto-firing alert() vector exists —
   and crucially distinguishes the two rendering modes:
     'parser'    — reflected into the response, parsed at page load
                   → a <script> element runs.
     'innerHTML' — assigned via an innerHTML sink
                   → the <script> node is built but never executed.
   That difference is the whole DOM-vs-reflected lesson. */
/* The alert() call detector. Attribute values are entity-decoded before
   testing (real browsers decode them), \uXXXX escapes resolved, and a bare
   template literal is NOT a call. */
const ALERT_CALL = /(alert|confirm|prompt|print)\s*\(/i;
function entDec(s){
  return String(s)
    .replace(/&(?:#x([0-9a-f]+)|#(\d+)|([a-z]+));/gi, (m, hx, d, name) => {
      if (hx) return String.fromCharCode(parseInt(hx, 16));
      if (d) return String.fromCharCode(+d);
      const named = { tab:"\t", colon:":", lpar:"(", rpar:")", sol:"/", quot:"\"" };
      return named[name ? name.toLowerCase() : ""] ?? m;
    })
    .replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}
function callsAlert(body){ return ALERT_CALL.test(entDec(body)); }

function alertArg(payload){
  const m = /(?:alert|confirm|prompt|print)\s*\(\s*([^)]*)\)/i.exec(payload);
  if (!m) return null;
  let arg = m[1].trim().replace(/^['"]|['"]$/g, "");
  return arg === "" ? "" : arg;
}

/* Which tag+handler combinations fire with no user interaction. tagText is
   the WHOLE tag (attribute order must not matter); resource-bearing handlers
   need something to load, and mode distinguishes page-load parsing (body
   onload fires) from innerHTML fragments (it doesn't). */
function autoFires(tag, handler, tagText, mode = "parser"){
  const resource = /\b(?:src|href|data|poster)\s*=|type\s*=\s*["']?image/i.test(tagText);
  if (handler === "onload"){
    if (tag === "svg") return true;
    if (tag === "body" || tag === "frameset") return mode === "parser";
    if (["iframe", "object", "image"].includes(tag)) return resource;
    return false;
  }
  if (handler === "onerror"){
    if (["img", "image", "script", "source", "video", "audio", "link", "input"].includes(tag)) return resource;
    return false;
  }
  if (handler === "onfocus")
    return ["input", "textarea", "select", "button"].includes(tag) && /\bautofocus\b/i.test(tagText);
  if (handler === "ontoggle") return tag === "details" && /\bopen\b/i.test(tagText);
  if (handler === "onstart") return tag === "marquee";
  if (handler === "onbegin") return tag === "animate";
  return false;  // click / mouseover / pointerover genuinely need the user
}

function scanVectors(html, mode){
  const vectors = [];

  // 1) <script> elements
  const scriptRe = /<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi;
  let m;
  while ((m = scriptRe.exec(html))){
    const hasSrc = /\bsrc\s*=/i.test(m[0]);
    const calls = callsAlert(m[1]);
    if (mode === "parser"){
      vectors.push({ code:"<script>…<\/script>", fires: calls && !hasSrc, interaction:false,
        why: hasSrc
          ? "An external <script> would load and run — this simulation can't fetch it, and no inline call exists."
          : calls ? "A <script> parsed at page load runs immediately."
                  : "A <script> runs, but this one calls nothing." });
    } else {
      vectors.push({ code:"<script>…<\/script>", fires:false, interaction:false,
        why: "Built by the innerHTML parser as a node, but the browser never runs script inserted through innerHTML." });
    }
  }

  // 2) event-handler attributes:  <tag ... onX=...>
  const onRe = /<([a-z][a-z0-9]*)\b([^>]*?)\bon([a-z]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]*))/gi;
  while ((m = onRe.exec(html))){
    const tag = m[1].toLowerCase(), handler = "on" + m[3].toLowerCase();
    const body = m[4] ?? m[5] ?? m[6] ?? "";
    const tagEnd = html.indexOf(">", m.index);   // the WHOLE tag — attrs before AND after the handler
    const tagText = html.slice(m.index, tagEnd === -1 ? html.length : tagEnd + 1);
    const calls = callsAlert(body);
    const auto = autoFires(tag, handler, tagText, mode);
    vectors.push({
      code:`<${tag} ${handler}=…>`,
      fires: auto && calls,
      interaction: !auto,
      why: auto
        ? (calls ? `${handler} on <${tag}> fires on load — no interaction needed.`
                 : `${handler} on <${tag}> fires, but calls nothing.`)
        : `${handler} never runs on its own — it needs the user to act first.`
    });
  }

  // 3) javascript: URIs
  const uriRe = /<(a|iframe)\b[^>]*?\b(?:href|src)\s*=\s*["']?\s*javascript:([^"'>]*)/gi;
  while ((m = uriRe.exec(html))){
    const tag = m[1].toLowerCase(), calls = callsAlert(m[2]), auto = tag === "iframe";
    vectors.push({ code:`<${tag} …=javascript:…>`, fires: auto && calls, interaction: !auto,
      why: auto ? "iframe src=javascript: runs on load."
                : "A javascript: link runs only when clicked." });
  }
  return vectors;
}

/* A single WAF-style blocklist. Deliberately a blocklist, so the lesson is
   that it can never enumerate every tag+handler the HTML parser accepts. */
const WAF_RULES = [
  { rx:/<script/i,     src:"/<script/i",    label:"script tags" },
  { rx:/onerror/i,     src:"/onerror/i",    label:"onerror handler" },
  { rx:/javascript:/i, src:"/javascript:/i",label:"javascript: URIs" }
];
function wafScan(payload){
  for (const r of WAF_RULES){
    const m = r.rx.exec(payload);
    if (m) return { blocked:true, rule:r, at:m.index, token:m[0] };
  }
  return { blocked:false, rule:null, at:-1, token:null };
}

/* Real DOM structure via the browser's own parser (browser-only; guarded so
   node can import the pure functions above). The payload is parsed into a
   DETACHED document and only read — never attached, so nothing executes. */
function buildDomTreeRaw(contextHtml, hostSel){
  if (typeof DOMParser === "undefined") return "";
  const doc = new DOMParser().parseFromString(`<!doctype html><body>${contextHtml}`, "text/html");
  const host = doc.querySelector(hostSel) || doc.body;
  const render = node => {
    let items = "";
    node.childNodes.forEach(ch => {
      if (ch.nodeType === 3){
        const t = ch.nodeValue.replace(/\s+/g, " ").trim();
        if (t) items += `<li><span class="node"><span class="txt">${esc(clip(t, 40))}</span></span></li>`;
      } else if (ch.nodeType === 1){
        const tag = ch.tagName.toLowerCase();
        let attrs = "";
        [...ch.attributes].forEach(at => {
          if (at.name === "data-inj") return;
          const on = /^on/i.test(at.name);
          attrs += ` <span class="at ${on ? "on" : ""}">${esc(at.name)}${at.value ? `="${esc(clip(at.value,22))}"` : ""}</span>`;
        });
        const isScript = tag === "script";
        const hasHandler = [...ch.attributes].some(a => /^on/i.test(a.name));
        let badge = "";
        if (isScript || hasHandler){
          const execs = window.__mode === "parser" ? true : hasHandler; // innerHTML: script inert, handlers live
          badge = ` <span class="badge ${execs ? "exec" : "inert"}">${execs ? "executes" : "inert"}</span>`;
        }
        const inner = render(ch);
        items += `<li><span class="node"><span class="el inj">&lt;<span class="nm">${esc(tag)}</span>${attrs}&gt;</span>${badge}</span>${inner}</li>`;
      }
    });
    return items ? `<ul>${items}</ul>` : "";
  };
  return `<div class="tree">${render(host)}</div>`;
}
/* Parsing the same payload twice is wasted work — cache by input. */
const _domTreeCache = new Map();
function buildDomTree(contextHtml, hostSel){
  const key = contextHtml + "\u0000" + hostSel + "\u0000" + (typeof window !== "undefined" ? window.__mode : "");
  if (_domTreeCache.has(key)) return _domTreeCache.get(key);
  const out = buildDomTreeRaw(contextHtml, hostSel);
  _domTreeCache.set(key, out);
  if (_domTreeCache.size > 40) _domTreeCache.delete(_domTreeCache.keys().next().value);
  return out;
}

  {id:2, name:"Halide Sensor Array",       price:1140.00, released:1},

  {id:2, email:"r.okafor@aperture.lab", password:md5("abc123")},
  {id:3, email:"j.lindqvist@aperture.lab", password:md5("12345678")}
