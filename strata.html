const TPL_A = "SELECT id, name, price FROM products WHERE name LIKE '%";
const TPL_B = "%' AND released = 1";

function sqlLex(sql){
  let inStr = false, litStart = -1, comment = -1;
  const spans = []; let i = 0;
  while (i < sql.length){
    const c = sql[i];
    if (inStr){
      if (c === "'"){
        if (sql[i + 1] === "'"){ i += 2; continue; }   // '' is an escaped quote, not a close
        inStr = false; spans.push([litStart, i + 1]);
      }
      i++; continue;
    }
    if (c === "'"){ inStr = true; litStart = i; i++; continue; }
    if (c === "-" && sql[i+1] === "-"){ comment = i; break; }
    if (c === "#"){ comment = i; break; }
    i++;
  }
  return { unterminated: inStr, litStart, comment, spans };
}

/* The SQL the parser actually acts on: string literals and comments blanked
   to spaces (offsets preserved). Every semantic decision below runs on THIS
   view, so keywords sitting inside the string can never be mistaken for
   SQL — the same rule the Intended/Parsed panes teach. */
function sqlCodeView(a){
  const r = sqlRegions(a);
  return a.sql.split("").map((c, i) => (r[i] === "lit" || r[i] === "cmt") ? " " : c).join("");
}

function sqliAnalyze(q){
  const sql = TPL_A + q + TPL_B;
  const tStart = TPL_A.length, tEnd = tStart + q.length;
  const lx = sqlLex(sql);
  const a = { q, sql, tStart, tEnd, lex: lx, error:null, rows:[], leaked:[],
              releasedFilter:true, tautology:false, union:false, unionLiterals:null };
  if (lx.unterminated){
    a.error = { at: lx.litStart, msg:'sqlite3.OperationalError: unrecognized token: "\'"' };
    return a;
  }
  const code = sqlCodeView(a);
  a.releasedFilter = /released\s*=\s*1/i.test(code);
  // A top-level OR makes the template's own LIKE '%' a standalone TRUE
  // disjunct (AND binds tighter), so the released filter only guards the
  // other side of the OR — every row comes back, withheld or not.
  a.tautology = /\bOR\b/i.test(code);

  // Payload bytes that became CODE: a tiny grammar check with sqlite3's
  // own error messages. `' FOOBAR--` and stacked statements die here.
  const pc = code.slice(tStart, tEnd).replace(/\s+/g, " ").trim();
  if (pc){
    if (pc.includes(";")){
      a.error = { at: tStart, msg:"sqlite3.OperationalError: You can only execute one statement at a time." };
      return a;
    }
    const ob = /^order\s+by\s+(\d+)$/i.exec(pc);
    if (ob && +ob[1] > 3){
      a.error = { at: tStart, msg:"sqlite3.OperationalError: 1st ORDER BY term out of range - should be between 1 and 3" };
      return a;
    }
    if (!/^(?:or|and)\b/i.test(pc) && !ob && !/^union\b/i.test(pc)){
      a.error = { at: tStart, msg:`sqlite3.OperationalError: near "${pc.split(/\s+/)[0]}": syntax error` };
      return a;
    }
  }

  // UNION: the outer query selects three columns — sqlite enforces the count.
  const um = /\bUNION\s+(?:ALL\s+)?SELECT\s+(.+?)\s+FROM\s+([a-z_][\w]*)/i.exec(code);
  if (um){
    if (um[2].toLowerCase() !== "users"){
      a.error = { at: tStart, msg:`sqlite3.OperationalError: no such table: ${um[2]}` };
      return a;
    }
    a.union = true;
    const terms = um[1].split(",").map(t => t.trim()).filter(t => t !== "");
    if (terms.length !== 3){
      a.error = { at: tStart, msg:"sqlite3.OperationalError: SELECTs to the left and right of UNION do not have the same number of result columns" };
      return a;
    }
    if (terms.every(t => /^(id|email|password)$/i.test(t))) a.leaked = USERS.slice();
    else a.unionLiterals = terms;   // 3 columns — of constants, not the table
  }

  let rows;
  if (a.tautology || a.union) rows = PRODUCTS.slice();
  else { const cut = q.indexOf("'"); const needle = (cut >= 0 ? q.slice(0, cut) : q).toLowerCase();
         rows = PRODUCTS.filter(p => p.name.toLowerCase().includes(needle)); }
  if (a.releasedFilter && !a.tautology && !a.union) rows = rows.filter(p => p.released === 1);
  a.rows = rows;
  return a;
}
function sqlRegions(a){
  const { sql, lex: lx } = a;
  const r = new Array(sql.length).fill("code");
  lx.spans.forEach(([s, e]) => { for (let i = s; i < e; i++) r[i] = "lit"; });
  if (lx.unterminated && lx.litStart >= 0) for (let i = lx.litStart; i < sql.length; i++) r[i] = "open";
  if (lx.comment >= 0) for (let i = lx.comment; i < sql.length; i++) r[i] = "cmt";
  return r;
}
function sqlReadActual(a){
  const { sql, tStart, tEnd } = a, r = sqlRegions(a);
  let html = "", i = 0;
  while (i < sql.length){
    const t = i >= tStart && i < tEnd, reg = r[i]; let j = i;
    while (j < sql.length && (j >= tStart && j < tEnd) === t && r[j] === reg) j++;
    const txt = esc(sql.slice(i, j)); let cls;
    if (t) cls = reg === "code" || reg === "open" ? "tn syn" : reg === "cmt" ? "tn dead" : "tn";
    else   cls = reg === "lit" ? "str" : reg === "cmt" ? "cm dead" : reg === "open" ? "unterm" : "";
    html += cls ? `<span class="${cls}">${txt}</span>` : txt; i = j;
  }
  return html;
}
function sqlReadIntent(a){
  const { sql, tStart, tEnd } = a;
  const openQ = sql.lastIndexOf("'", tStart);
  return esc(sql.slice(0, openQ)) + `<span class="str">${esc(sql.slice(openQ, tStart))}</span>`
    + `<span class="tn">${esc(sql.slice(tStart, tEnd))}</span>`
    + `<span class="str">${esc(sql.slice(tEnd, tEnd + 2))}</span>` + esc(sql.slice(tEnd + 2));
}

      {h:"L5 · Query",   state:st(5,a), b:a.error ? `Rejected at <em>offset ${a.error.at}</em>.` : (syn ? `<em>${syn}</em> ${plural(syn,"byte","bytes")} parsed as syntax.` : `All bytes stayed data.`)},
      {h:"L6 · Data",    state:st(6,a), b:a.error ? `Nothing executed.` : `<em>${rows}</em> ${plural(rows,"row","rows")} out${a.leaked.length?`, <strong>${a.leaked.length} credential</strong>`:""}.`}
    ];
  },
  verdict(a){
    const unreleased = a.rows.filter(p => !p.released).length;
    const sev = a.leaked.length ? ["Critical","bad"] : unreleased ? ["High","hot"] : a.error ? ["Info",""] : ["No finding","good"];
    return [ ["Status", a.error?"500":"200", a.error?"bad":""],
             ["Rows out", String(a.rows.length + a.leaked.length), a.leaked.length?"hot":""],
             ["Withheld reached", String(unreleased), unreleased?"hot":""],
             ["Severity", sev[0], sev[1]] ];
  }
};

/* ════════════════════════════════════════════════════════════════════
   XSS LAB SHELL — three labs share layers, chrome and surface, differ in
   where the taint travels and where the bug lives.
   ════════════════════════════════════════════════════════════════════ */
const XSS_LAYERS = [
  {code:"L0",title:"Surface", meta:"rendered page"},
  {code:"L1",title:"Client",  meta:"page scripts"},
  {code:"L2",title:"Request", meta:"HTTP out"},
  {code:"L3",title:"Edge",    meta:"WAF / CDN"},
  {code:"L4",title:"Server",  meta:"app.py"},
  {code:"L5",title:"Response",meta:"HTTP in"},
  {code:"L6",title:"Parse & DOM", meta:"HTML tokenizer"}
];
const HOST = "shop.strata.lab";

/* Render a payload the way a browser visibly would, but SANITISED: only a
   whitelist of formatting tags survive, all handlers/scripts/svg are dropped
   (invisible, exactly as they render), <img> becomes a broken-image glyph and
   never loads. Benign markup like <b> really renders; the alert() dialog is
   the visible effect of anything that executes. Nothing runs or fetches. */
/* URL schemes survive attribute parsing with control characters intact
   ("jav&#x09;ascript:") — a real browser strips them before deciding the
   scheme, so the safety check must too. Only same-document or http(s)
   survive out of an untrusted fragment. */
function safeHref(h){
  const clean = String(h).replace(/[\x00-\x20\x7f]/g, "");
  return /^(?:javascript|data|vbscript|file):/i.test(clean) ? "#" : h;
}
const SAFE_TAGS = new Set(["B","I","U","EM","STRONG","SPAN","MARK","SMALL","CODE","BR","P","A","H2","H3","UL","OL","LI"]);
function safeRenderRaw(frag){
  if (typeof DOMParser === "undefined") return esc(frag);
  const doc = new DOMParser().parseFromString(`<!doctype html><body><div id="r">${frag}</div>`, "text/html");
  const walk = node => {
    let out = "";
    node.childNodes.forEach(ch => {
      if (ch.nodeType === 3) out += esc(ch.nodeValue);
      else if (ch.nodeType === 1){
        const T = ch.tagName;
        if (T === "IMG"){ out += `<span class="brokenimg">▨</span>`; return; }
        if (!SAFE_TAGS.has(T)) return;              // script / svg / iframe / object → no visible box
        const t = T.toLowerCase();
        let attrs = "";
        if (t === "a"){ attrs = ` href="${esc(safeHref(ch.getAttribute("href") || "#"))}"`; }
        out += `<${t}${attrs}>${walk(ch)}</${t}>`;
      }
    });
    return out;
  };
  return walk(doc.getElementById("r"));
}
const _safeCache = new Map();
function safeRender(frag){
  if (_safeCache.has(frag)) return _safeCache.get(frag);
  const out = safeRenderRaw(frag);
  _safeCache.set(frag, out);
  if (_safeCache.size > 40) _safeCache.delete(_safeCache.keys().next().value);
  return out;
}

/* The storefront chrome shared by every lab's L0: a browser window with an
   address bar, an Aperture header, and either a live search box (reflected /
   SQLi / WAF) or an editable URL-fragment (DOM). */
function siteFrame({ path, q, editFrag, search = true, body }){
  const addr = editFrag !== undefined
    ? `${HOST}${esc(path)}<span class="frag">#</span><input class="fraginput" data-live data-frag spellcheck="false" value="${esc(editFrag)}">`
    : `${HOST}${esc(path)}`;
  const searchbar = search
    ? `<form class="s-search" data-run autocomplete="off">
         <input class="s-q" data-live placeholder="Search Aperture…" spellcheck="false" value="${esc(q ?? "")}">
         <button type="submit" class="s-go">Search</button></form>`
    : `<div class="s-search"><input class="s-q" placeholder="Search Aperture…" disabled><button class="s-go" disabled>Search</button></div>`;
  return `<div class="browserframe">
    <div class="bbar"><span class="dots"><i></i><i></i><i></i></span>
      <span class="addr"><span class="lock">🔒</span><span class="url">https://${addr}</span></span>
      <span class="bmenu">⋮</span></div>
    <div class="site">
      <header class="s-head"><span class="s-logo">APERTURE</span>
        <nav class="s-nav"><a>New</a><a>Cameras</a><a>Lenses</a><a>Deals</a></nav>
        ${searchbar}<span class="s-cart">🛒<sup>2</sup></span></header>
      <main class="s-main">${body}</main>
    </div></div>`;
}

const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_");

};

  challenge:{ steps:[
    { id:"resist", label:"See bcrypt resist", test:a => a.bcrypt,
      hints:["Not every row falls — feed it the one hash in the table that isn't md5.",

      reveal:"$2b$12$Rk9c…saltysaltysalty" },
    { id:"crack", label:"Crack the admin's md5", test:a => a.who?.email === "admin@aperture.lab" && !!a.plain,
      hints:["A rainbow table is just a precomputed wordlist — common words fall first.",
             "The admin used the most common password in the world."],
      reveal:HASH_ADMIN }
  ]},
  analyze(q){
    const hash = String(q).trim();
    const isMd5 = /^[a-f0-9]{32}$/i.test(hash);

        {t:`<span class="kw">def</span> store_password(pw):`},
        {t:`    <span class="kw">return</span> hashlib.md5(pw.encode()).hexdigest()   <span class="cm"># ✗ fast, no salt</span>`, hot:true},
        {t:``},

  if (!s.startsWith("/")) s = "/" + s;

  for (const seg of s.split("/")){
    if (seg === "" || seg === ".") continue;
    if (seg === ".."){ out.pop(); continue; }
    out.push(seg);
  }
  return "/" + out.join("/");

/* ── A08 · JWT helpers ── */
function jwtToken(role){
  const header = { alg:"none", typ:"JWT" };
  const payload = { sub:"you@aperture.lab", role, iat:1753900000 };
  return b64url(JSON.stringify(header)) + "." + b64url(JSON.stringify(payload)) + ".";
}

/* ── A10 · SERVER-SIDE REQUEST FORGERY (SSRF) ─────────────────────────
   The internal/external decision runs through a REAL IP canonicalizer:
   dotted, decimal, hex and octal IPv4 shorthands (127.1, 0x7f000001,
   2130706433), IPv6-mapped and bracketed forms, and metadata hostnames
   all resolve to a canonical address before classification. The lesson:
   no string blocklist survives contact with address canonicalization. */
function parseIPv4(host){
  if (!/^[0-9a-fx.]+$/i.test(host)) return null;
  const parts = host.split(".");
  if (parts.length > 4) return null;
  const vals = parts.map(p => {
    if (p === "") return NaN;
    if (/^0[xX][0-9a-f]+$/i.test(p)) return parseInt(p, 16);
    if (/^0[0-7]+$/.test(p)) return parseInt(p, 8);
    if (/^\d+$/.test(p)) return parseInt(p, 10);
    return NaN;
  });
  if (vals.some(Number.isNaN)) return null;
  let ip = 0;
  for (let i = 0; i < vals.length - 1; i++){
    if (vals[i] > 255) return null;
    ip = ip * 256 + vals[i];
  }
  const last = vals[vals.length - 1];
  if (last >= 256 ** (5 - vals.length)) return null;   // must fit the remaining bytes
  return ip * 256 ** (5 - vals.length) + last;
}
const u32ToDotted = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
const METADATA_NAMES = new Set(["metadata.google.internal", "metadata", "instance-data"]);

function classifyHost(raw){
  let h = String(raw || "").trim().toLowerCase().replace(/^\[|\]$/g, "");
  if (h.endsWith(".")) h = h.slice(0, -1);
  if (!h) return { kind:"none" };
  if (h.includes(":")){                                   // IPv6 forms
    const m4 = /::ffff:(\d+\.\d+\.\d+\.\d+)$/.exec(h);
    if (m4) return classifyHost(m4[1]);                   // ::ffff:169.254.169.254
    const mh = /::ffff:([0-9a-f]{8})$/i.exec(h);
    if (mh) return classifyHost(u32ToDotted(parseInt(mh[1], 16) >>> 0));   // ::ffff:a9fea9fe
    if (h === "::1") return { kind:"loopback", ip:"127.0.0.1" };
    return { kind:"private", ip:h };                      // conservative: treat literal v6 as internal
  }
  const u32 = parseIPv4(h);
  if (u32 !== null){
    const d = u32ToDotted(u32);
    const a = (u32 >>> 24) & 255, b = (u32 >>> 16) & 255;
    if (d === "169.254.169.254") return { kind:"metadata", ip:d };
    if (a === 127 || a === 0) return { kind:"loopback", ip:d };
    if (a === 10 || (a === 192 && b === 168) || (a === 172 && b >= 16 && b <= 31) || (a === 169 && b === 254))
      return { kind:"private", ip:d };
    return { kind:"external", ip:d };
  }
  if (METADATA_NAMES.has(h)) return { kind:"metadata", ip:"169.254.169.254" };
  if (h === "localhost" || h.endsWith(".localhost") || h.endsWith(".internal")) return { kind:"loopback", ip:"127.0.0.1" };
  return { kind:"name", host:h };
}

function hostOf(url){
  // authority-aware: userinfo is stripped at the LAST "@" (user@169.254.169.254
  // is still the metadata service — the classic string-blocklist bypass),
  // then the port; bracketed IPv6 literals survive whole.
  const m = /^\s*[a-z]+:\/\/([^\/?#]+)/i.exec(url);
  if (!m) return null;
  let auth = m[1];
  const at = auth.lastIndexOf("@");
  if (at >= 0) auth = auth.slice(at + 1);
  const hm = /^(\[[^\]]*\]|[^:]+)/.exec(auth);
  return (hm ? hm[1] : auth).toLowerCase();
}

/* tiny markdown → html for the A06 preview (bold, italic, heading, links, raw HTML passthrough) */
function mdToHtml(md){
  return String(md)
    .replace(/^#\s+(.+)$/gm, "<h3>$1</h3>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}

/* ════════════════════════════════════════════════════════════════════
   EXTERNAL LABS — the "infinite labs" seam. A lab file is a plain .js
   that calls STRATA.registerLab({...}). It is validated against the lab
   contract — including a real smoke run of analyze/layerState/render —
   before it joins the catalog. See docs/AUTHORING.md.
   ════════════════════════════════════════════════════════════════════ */
const LAB_STATES = new Set(["present", "promoted", "sink", "boundary", "blocked", "absent", "clean"]);

function validateLab(L, opts = {}){
  const errs = [];
  const need = (c, m) => { if (!c) errs.push(m); };
  need(L && typeof L === "object" && !Array.isArray(L), "lab must be an object");
  if (!L || typeof L !== "object") return { ok:false, errs };
  need(typeof L.id === "string" && /^[a-z0-9][a-z0-9-]{1,31}$/.test(L.id), "id: lowercase slug (letters/digits/dashes), 2–32 chars");
  need(!["constructor", "prototype", "__proto__", "hasOwnProperty"].includes(L.id), 'id: reserved — pick another slug');
  if (typeof L.id === "string" && !opts.allowReplace)
    need(!LABS.some(x => x.id === L.id), `id: "${L.id}" already exists (reloading a lab replaces it — this error means validation ran outside registerLab)`);
  for (const f of ["code", "title", "cat"])
    need(typeof L[f] === "string" && L[f].length, `${f}: required non-empty string`);
  need(["Beginner", "Apprentice", "Practitioner"].includes(L.difficulty),
    'difficulty: one of "Beginner" | "Apprentice" | "Practitioner"');
  need(typeof L.goal === "string" && L.goal.length, "goal: required string (HTML allowed)");
  const N = Array.isArray(L.layers) ? L.layers.length : 0;
  need(N >= 4 && N <= 9, `layers: need 4–9 entries (7 is the house style) — got ${N}`);
  if (N){
    L.layers.forEach((ly, i) =>
      need(ly && typeof ly.code === "string" && typeof ly.title === "string" && typeof ly.meta === "string",
        `layers[${i}]: needs {code, title, meta} strings`));
    need(Number.isInteger(L.boundary) && L.boundary >= 0 && L.boundary <= N - 2,
      `boundary: integer 0..${N - 2} (the membrane floats between planes)`);
  }
  need(Array.isArray(L.presets) && L.presets.length >= 1, "presets: at least one {q, label}");
  (L.presets || []).forEach((p, i) =>
    need(p && typeof p.q === "string" && typeof p.label === "string", `presets[${i}]: {q, label} strings`));
  need((L.presets || []).some(p => p && !p.spoiler),
    "presets: keep at least one visible (non-spoiler) guided example — the answer hides, the tour doesn't");
  need(typeof L.defaultQ === "string", "defaultQ: string — the lab's opening state");
  for (const f of ["analyze", "layerState", "trace", "verdict"])
    need(typeof L[f] === "function", `${f}: required function`);
  if (!L.tour) need(typeof L.solved === "function", "solved: required function (or set tour:true for a guided tour)");
  need(L.render && typeof L.render === "object" && !Array.isArray(L.render), "render: object keyed by layer index");
  if (L.render && N) for (let i = 0; i < N; i++)
    need(typeof L.render[i] === "function", `render[${i}]: required function`);
  if (L.onFire) need(typeof L.onFire === "function", "onFire: must be a function (optional)");
  if (L.notes) need(typeof L.notes === "string" && L.notes.length, "notes: HTML string — shown in the lab's Explanation popup (optional)");
  if (L.domMode) need(["parser", "innerHTML"].includes(L.domMode), 'domMode: "parser" | "innerHTML" (optional)');
  if (L.challenge){
    need(Array.isArray(L.challenge.steps) && L.challenge.steps.length, "challenge.steps: non-empty array");
    const seen = new Set();
    (L.challenge.steps || []).forEach((s, i) => {
      need(s && typeof s.id === "string" && typeof s.label === "string" && typeof s.test === "function",
        `challenge.steps[${i}]: {id, label, test()}`);
      need(typeof s.reveal === "string" && s.reveal.length, `challenge.steps[${i}].reveal: payload string (required)`);
      need(Array.isArray(s.hints) && s.hints.length >= 1, `challenge.steps[${i}].hints: at least one hint string (required)`);
      if (typeof s.id === "string"){
        need(!seen.has(s.id), `challenge.steps[${i}].id: "${s.id}" is duplicated — ids key saved progress`);
        seen.add(s.id);
      }
    });
  }
  const WIRES = ["query", "path", "json", "form", "login", "fragment", "offline"];
  if (L.wire){
    need(WIRES.includes(L.wire.type) || (typeof L.wire.build === "function" && typeof L.wire.parse === "function"),
      `wire.type: one of ${WIRES.join(" | ")} — or any custom type IF you also supply build(q) and parse(raw)`);
    if (["query", "json", "form"].includes(L.wire.type))
      need(typeof L.wire.param === "string", `wire.param: required for type "${L.wire.type}"`);
  }
  if (L.card){
    need(!Array.isArray(L.card.sig) || (L.card.sig.length === N && L.card.sig.every(c => "axds".includes(c))),
      `card.sig: exactly ${N} marks, each one of a | x | d | s`);
  }
  // smoke: actually RUN the engine — on the default state, every preset, and
  // a battery of hostile probes. A lab that crashes at the first keystroke
  // is not a lab.
  const probes = [L.defaultQ, ...(L.presets || []).map(p => p.q), "", "<", "'", '"', "//", "a".repeat(64)];
  for (const probe of probes){
    let a;
    try {
      a = L.analyze(probe);
    } catch (err){
      errs.push(`engine smoke test threw on analyze(${JSON.stringify(probe.slice(0, 24))}): ` + (err && err.message));
      break;
    }
    try {
      for (let i = 0; i < N; i++){
        const st = L.layerState(i, a);
        need(LAB_STATES.has(st), `layerState(${i}) returned "${st}" — use the vocabulary: ${[...LAB_STATES].join(" | ")}`);
        const html = L.render[i](a);
        need(typeof html === "string", `render[${i}](analysis) must return a string`);
      }
      const tr = L.trace(a);
      need(Array.isArray(tr) && tr.length === N, "trace(analysis): one entry per layer, each {h, state, b}");
      if (Array.isArray(tr)) tr.forEach((s, i) =>
        need(s && typeof s.h === "string" && typeof s.b === "string" && LAB_STATES.has(s.state),
          `trace[${i}]: {h, b, state} and state must be in the vocabulary`));
      need(Array.isArray(L.verdict(a)), "verdict(analysis): array of [key, value, cls] rows");
      if (typeof L.solved === "function") L.solved(a);
      (L.challenge?.steps || []).forEach(st => { try { st.test(a); } catch (err){
        errs.push(`challenge step "${st.id}" test() threw: ` + (err && err.message)); } });
      if (typeof L.onFire === "function") L.onFire(a);
    } catch (err){
      errs.push("engine smoke test threw: " + (err && err.message));
      break;
    }
  }
  return { ok: !errs.length, errs };
}

function showLabErrors(title, errs){
  const w = document.createElement("div");
  w.className = "modalwrap";
  w.innerHTML = `<div class="modalbox"><h3>${esc(title)}</h3>
    <ul>${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
    <button class="mok">Back to the drawing board</button></div>`;
  w.querySelector(".mok").addEventListener("click", () => w.remove());
  w.addEventListener("click", e => { if (e.target === w) w.remove(); });
  document.body.appendChild(w);
}

/* Runs a lab file's code. The file must call STRATA.registerLab(lab).
   A lab file is LOCAL CODE with the page's full privileges — validation
   checks shape, not safety. Only load files you trust. */
function loadLabText(code, name){
  const before = LABS.length;
  let runErr = null;
  const onErr = e => { if (!(e.target && e.target.src)) runErr = e.message || "script error"; };
  window.addEventListener("error", onErr);
  const s = document.createElement("script");
  s.textContent = code + `\n//# sourceURL=${name || "strata-lab-file.js"}`;
  document.head.appendChild(s);
  window.removeEventListener("error", onErr);
  if (runErr){
    showLabErrors("Lab file failed to run", [
      "The file threw while it evaluated: " + runErr,
      "Usually a syntax error — the browser console has the exact line."
    ]);
    return;
  }
  if (LABS.length === before)
    showLabErrors("Lab file did not register", ["The file ran but never called STRATA.registerLab(lab). Wrap your lab object in that call — see templates/lab-template.js."]);
}

window.STRATA = {
  labs: LABS,
  registerLab(lab, opts = {}){
    if (BUILTIN_IDS.has(lab?.id)){
      showLabErrors("Reserved id", [`id "${lab.id}" belongs to a built-in lab — pick a different id for yours.`]);
      return false;
    }
    const existing = LABS.findIndex(x => x.id === lab?.id);
    const v = validateLab(lab, { allowReplace: existing >= 0 });
    if (!v.ok){ showLabErrors(`Lab "${lab && lab.id ? lab.id : "?"}" failed validation`, v.errs); return false; }
    if (existing >= 0) LABS.splice(existing, 1, lab);   // reload = replace, so authors can iterate
    else LABS.push(lab);
    buildPicker(); buildHome();   // earned progress is kept across reloads
    if (!opts.silent){ toast(`Lab loaded: ${lab.code} · ${lab.title}`); enterLab(lab.id); }
    return true;
  },
  validate: validateLab,
  /* everything a lab author builds content with */
  helpers: { esc, taint, taintMarkup, codeLines, note, explain, kv, field, siteFrame,
             productCard, safeRender, buildDomTree, intendedVsParsed, vectorList,
             alertSim, scanVectors, wafScan, md5, clip, plural }
};

   ════════════════════════════════════════════════════════════════════ */
const el = id => document.getElementById(id);
const scene = el("scene"), stageEl = el("stage");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const callHost = document.createElement("div");
callHost.className = "callouts";
scene.appendChild(callHost);

let LAB = LABS[0];
let planes = [], calls = [], tiers = [], planeDirty = [];
const state = { q:"", active:0, cross:false, analysis:null, source:"boot", ix:false, alertSeen:null, showSpoilers:false };

/* lab picker */
function buildPicker(){
  const groups = {};
  LABS.forEach(l => (groups[l.cat] ??= []).push(l));
  el("labsel").innerHTML = Object.entries(groups).map(([cat, ls]) =>
    `<optgroup label="${esc(cat)}">${ls.map(l => `<option value="${l.id}">${esc(l.code)} · ${esc(l.title)}</option>`).join("")}</optgroup>`
  ).join("");
}
el("labsel").addEventListener("change", e => buildLab(e.target.value));
buildPicker();

function buildLab(id){
  LAB = LABS.find(l => l.id === id) || LABS[0];
  // innerHTML-sink labs mark their DOM trees differently (script nodes are inert)
  window.__mode = (LAB.domMode === "innerHTML" || LAB.id === "xss-dom") ? "innerHTML" : "parser";
  fillGen++;   // cancels any lazy-fill chain still running for the previous lab

  // reset scene
  planes.forEach(p => p.remove()); calls.forEach(c => c.remove());
  planes = []; calls = []; planeDirty = []; el("stackup").innerHTML = "";
  state.ix = false; state.source = "boot"; state.alertSeen = null; state.showSpoilers = false;

  LAB.layers.forEach((L, i) => {
    const p = document.createElement("section");
    p.className = "plane";
    p.innerHTML = `<div class="phead"><span class="lc">${esc(L.code)}</span><span class="lt">${esc(L.title)}</span><span class="lm">${esc(L.meta)}</span></div><div class="pbody"></div>`;
    scene.appendChild(p); planes.push(p);

    const c = document.createElement("div");
    c.className = "pcall";
    c.innerHTML = `<span><span class="bc">${esc(L.code)}</span><span class="bt">${esc(L.title)}</span><span class="bm">${esc(L.meta)}</span></span>`;
    callHost.appendChild(c); calls.push(c);

    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "tier"; b.type = "button";
    b.innerHTML = `<span class="lc">${esc(L.code)}</span><span class="lt">${esc(L.title)}</span><span class="lm">${esc(L.meta)}</span>`;
    b.addEventListener("click", () => go(i));
    li.appendChild(b); el("stackup").appendChild(li);

    if (i === LAB.boundary){
      const bd = document.createElement("li");
      bd.className = "boundary callout" + (LAB.boundaryTone === "safe" ? " safe" : "");
      bd.textContent = LAB.boundaryLabel;
      el("stackup").appendChild(bd);
    }
  });
  tiers = [...document.querySelectorAll(".tier")];
  const mem = el("membrane");
  mem.querySelector("span").textContent = LAB.boundaryLabel;
  mem.classList.toggle("safe", LAB.boundaryTone === "safe");

  // header
  el("labCode").textContent = LAB.code;
  el("labDiff").textContent = LAB.difficulty;
  el("labGoal").innerHTML = LAB.goal;
  el("labsel").value = LAB.id;
  el("presetLbl").textContent = LAB.consoleLabel || "Payloads";

  // intercept affordance — a lab without a wire gets the lesson, not the tool
  const ixBtn = el("ixBtn");
  ixBtn.hidden = !LAB.wire;
  ixBtn.setAttribute("aria-pressed", "false");
  el("ixTxt").textContent = "Intercept";
  if (LAB.wire?.type === "fragment")
    ixBtn.title = "The fragment never leaves the browser — there is nothing to intercept (that IS the DOM-XSS lesson)";
  else if (LAB.wire?.type === "offline")
    ixBtn.title = "This lab replays a scenario offline — there is no live request";
  else
    ixBtn.title = "Intercept the lab's virtual request — edit the raw bytes, then send";

  // per-lab explanation popup (bottom-right) — only when the lab has notes
  el("exwrap").hidden = true;
  el("explainBtn").hidden = !LAB.notes;

  // presets (solution presets stay locked until the lab is solved)
  rebuildConsole();

  state.active = 0; state.cross = false;
  run(LAB.defaultQ, { source:"boot" });
}

/* Solution presets ("spoiler:true") stay hidden until the lab is solved —
   the student earns them — but "Show response" reveals them on demand,
   clearly marked as answers. Everything else stays a guided example. */
function visiblePresets(){
  return LAB.presets.filter(p => !p.spoiler || labUnlocked(LAB) || state.showSpoilers);
}
let consoleKey = "";
function rebuildConsole(){
  const unlocked = labUnlocked(LAB);
  const hiddenAnswers = !unlocked && LAB.presets.some(p => p.spoiler);
  el("presets").innerHTML = visiblePresets().map(p =>
    `<button class="pre ${p.spoiler && !unlocked ? "answer" : ""}" data-q="${esc(p.q)}"><span>${esc(clip(p.q, 32))}</span><small>${esc(p.label)}${p.spoiler && !unlocked ? " · answer" : ""}</small></button>`).join("")
    + (hiddenAnswers ? `<button class="pre showresp" id="showResp" aria-pressed="${state.showSpoilers}">${state.showSpoilers ? "Hide response" : "Show response"}</button>` : "");
  consoleKey = LAB.id + ":" + unlocked + ":" + state.showSpoilers;
}

el("presets").addEventListener("click", e => {
  const b = e.target.closest(".pre"); if (!b) return;
  if (b.id === "showResp"){
    state.showSpoilers = !state.showSpoilers;
    rebuildConsole(); paintHud();
    return;
  }
  fire(b.dataset.q, "preset");
});

/* fire(): every user-initiated send goes through here, so intercept mode
   can pause the virtual request before it "leaves". */
function fire(q, source){
  if (state.ix && ixAvailable()) { openIx(q); return; }
  run(q, { source });
}

function layout(){
  const t0 = PERF ? performance.now() : 0;
  const N = LAB.layers.length;
  const { active, cross } = state;
  const gap = cross ? TOK.gapx : TOK.gap;
  const mid = (N - 1) / 2;
  const camZ = cross ? (mid + (active - mid) * 0.38) * gap : active * gap;

  scene.style.transform = cross
    ? `rotateX(${TOK.tiltx}) rotateZ(${TOK.spinx}) scale(${TOK.zoomx}) translateZ(${camZ}px)`
    : `rotateX(0deg) rotateZ(0deg) translateZ(${camZ}px)`;
  stageEl.classList.toggle("is-cross", cross);

  const a = state.analysis;
  calls.forEach((c, i) => {
    c.style.transform = `translateZ(${-i * gap + 3}px)`;
    c.classList.toggle("on", i === active);
    const s = a ? LAB.layerState(i, a) : "present";
    c.classList.toggle("blocked", s === "blocked");
    c.classList.toggle("absent", s === "absent");
  });

  planes.forEach((p, i) => {
    const rel = i - active;
    p.classList.toggle("active", rel === 0);
    p.style.pointerEvents = rel === 0 ? "auto" : "none";
    const s = a ? LAB.layerState(i, a) : "present";
    p.classList.toggle("st-blocked", s === "blocked");
    if (cross){
      p.style.transform = `translateZ(${-i * gap}px)`;
      p.style.opacity = String(Math.max(0.62, 1 - Math.abs(rel) * 0.06));
      p.style.filter = "none";
      p.style.visibility = "visible";
    } else {
      const y = rel > 0 ? -rel * TOK.fan : 0;
      p.style.transform = `translateZ(${-i * gap}px) translateY(${y}px)`;
      p.style.opacity = rel < 0 ? "0" : String(Math.max(0.14, 1 - rel * 0.17));
      // blur only the two nearest receding planes — beyond that, dimming
      // carries the depth and the raster cost disappears
      p.style.filter = rel > 0 ? `blur(${Math.min(rel, 2) * 0.7}px)` : "none";
      // two or more planes behind the camera: skip painting entirely
      p.style.visibility = rel < -1 ? "hidden" : "visible";
    }
  });

  const mem = el("membrane");
  mem.style.transform = `translateZ(${-(LAB.boundary + 0.5) * gap}px)`;
  mem.style.opacity = cross ? "1" : "0";

  tiers.forEach((t, i) => t.setAttribute("aria-current", i === active ? "true" : "false"));
  el("modeBtn").setAttribute("aria-pressed", String(cross));
  el("modeTxt").textContent = cross ? "Cross-section" : "Focus";
  if (PERF){ perfN.layout = performance.now() - t0; perfShow(); }
}

/* ── LAZY PLANE RENDERING ─────────────────────────────────────────────
   The active plane renders synchronously; everything else fills in the
   background after typing settles. The surface (plane 0) refreshes LIVE
   while typing — with focus, caret, composition state and page scroll
   restored — so the store visibly reacts to every keystroke. */
function renderPlane(i){
  const p = planes[i];
  if (!p || i >= LAB.layers.length) return;   // a pending fill may outlive a lab switch
  p.querySelector(".pbody").innerHTML = LAB.render[i](state.analysis);
  planeDirty[i] = false;
}

let fillT = 0, fillGen = 0;
function scheduleFill(){
  clearTimeout(fillT);
  if (PERF) perfN.dirty = planeDirty.filter(Boolean).length;
  fillT = setTimeout(() => {
    const gen = fillGen;
    const queue = planes.map((_, i) => i).filter(i => planeDirty[i]);
    if (!queue.length) return;
    const step = () => {
      if (gen !== fillGen) return;                        // lab switched under us
      // never swap the surface out from under a focused input
      while (queue.length && queue[0] === 0 &&
             planes[0].contains(document.activeElement) &&
             document.activeElement.tagName === "INPUT") queue.shift();
      for (let k = 0; k < 2 && queue.length; k++) renderPlane(queue.shift());
      if (queue.length) (window.requestIdleCallback || setTimeout)(step);
      if (PERF){ perfN.dirty = planeDirty.filter(Boolean).length; perfShow(); }
    };
    (window.requestIdleCallback || setTimeout)(step);
  }, 320);
}

function paint(){
  const t0 = PERF ? performance.now() : 0;
  for (let i = 0; i < planes.length; i++) planeDirty[i] = true;
  renderPlane(0); bindSurface();
  if (planeDirty[state.active] && state.active !== 0) renderPlane(state.active);
  paintHud();
  scheduleFill();
  if (PERF){ perfN.paint = performance.now() - t0; perfShow(); }
}

let composing = false;
function paintLiveSurface(){
  if (composing) return;                       // let the IME finish its composition
  const active = document.activeElement;
  const inSurface = active && planes[0] && planes[0].contains(active) && active.tagName === "INPUT";
  if (!inSurface){ renderPlane(0); bindSurface(); return; }
  const inputs = [...planes[0].querySelectorAll("input")];
  const idx = inputs.indexOf(active);
  const s0 = active.selectionStart, s1 = active.selectionEnd;
  const site = planes[0].querySelector(".site");
  const siteTop = site ? site.scrollTop : 0;
  renderPlane(0); bindSurface();
  const again = [...planes[0].querySelectorAll("input")][idx];
  if (again){ again.focus(); try { again.setSelectionRange(s0, s1); } catch(_){} }
  const site2 = planes[0].querySelector(".site");
  if (site2) site2.scrollTop = siteTop;
}

/* The cheap, always-fresh HUD: trace, verdict, objectives, pill. */
function paintHud(){
  const a = state.analysis;
  el("trace").innerHTML = LAB.trace(a).map((s, i) => {
    const cls = STEP_CLASS[s.state] ?? "";
    const active = i <= state.active;
    return `<li class="step ${active ? cls : (s.state === "absent" ? "absent" : "")}"><div class="sh">${esc(s.h)}</div><div class="sb">${s.b}</div></li>`;
  }).join("");

  el("verdict").innerHTML = LAB.verdict(a).map(([k, v, c]) =>
    `<div class="vrow"><span class="k">${esc(k)}</span><span class="v ${c || ""}">${esc(v)}</span></div>`).join("");

  refreshObjectives(a);

  [...document.querySelectorAll(".pre")].forEach(b =>
    b.classList.toggle("on", b.dataset.q === state.q));
}

/* ── OBJECTIVES ───────────────────────────────────────────────────────
   A lab with a challenge is a real lab: the student completes steps by
   making the ENGINE say so. Hints reveal on demand; the final reveal
   fires the payload but the solve is marked "with hints". A clean solve
   (all objectives) requires the last run to be typed or intercepted. */
function refreshObjectives(a){
  const ch = LAB.challenge, box = el("objs");
  const pill = el("solvePill");
  if (!ch || LAB.tour){
    box.hidden = true;
    if (LAB.tour){
      pill.classList.remove("done"); pill.classList.add("tour");
      el("solveTxt").textContent = "Guided tour";
    } else {
      pill.classList.remove("tour");
      const done = LAB.solved(a);
      pill.classList.toggle("done", done);
      el("solveTxt").textContent = done ? "Solved" : "Not solved";
    }
    return;
  }
  box.hidden = false;
  // progress carries a fingerprint (step ids + title): a replaced lab
  // resets, so stale solves never unlock the new version's spoilers
  const fp = (LAB.challenge ? LAB.challenge.steps.map(s => s.id).join(",") : "") + "|" + LAB.title;
  let p = progFor(LAB.id);
  if (p.fp && p.fp !== fp){
    PROGRESS[LAB.id] = { steps:{}, hints:{}, solved:false, solvedWithHelp:false, fp };
    saveProg(); p = PROGRESS[LAB.id];
  } else if (!p.fp){ p.fp = fp; }
  let done = 0, newly = false;
  ch.steps.forEach(st => {
    let ok = false;
    try { ok = !!st.test(a); } catch(_){}
    if (ok && !p.steps[st.id]){ p.steps[st.id] = true; newly = true; }
    if (p.steps[st.id]) done++;
  });
  const all = done === ch.steps.length;
  const interactive = ["typed", "intercept", "hint", "preset"].includes(state.source);
  if (all && interactive && (state.source === "typed" || state.source === "intercept") && !p.solved){
    const wasHelp = p.solvedWithHelp;
    p.solved = true; p.solvedWithHelp = false; newly = true;
    toast(wasHelp
      ? "Clean solve — the hint-run is wiped from the record."
      : "Lab solved — and you supplied the payload yourself.");
  } else if (all && !p.solved && !p.solvedWithHelp){
    p.solvedWithHelp = true; newly = true;
    toast("All objectives done — via preset or hint. Type the payload yourself for a clean solve.");
  }
  if (newly){ saveProg(); if (consoleKey !== LAB.id + ":" + labUnlocked(LAB)) rebuildConsole(); }

  el("objList").innerHTML = ch.steps.map(st => {
    const okc = p.steps[st.id];
    const rungs = st.hints || [];
    const used = p.hints[st.id] || 0;
    let ladder = "";
    if (!okc && used > 0){
      const hintTxt = used <= rungs.length ? `<div>${esc(rungs[used - 1])}</div>` : "";
      const payload = used > rungs.length
        ? `<div class="orv">payload: <code>${esc(st.reveal)}</code></div>` : "";
      const btn = used < rungs.length
        ? `<button class="orb" data-step="${esc(st.id)}" data-act="hint">Another hint</button>`
        : used === rungs.length
          ? `<button class="orb" data-step="${esc(st.id)}" data-act="reveal">Reveal payload</button>`
          : `<button class="orb" data-step="${esc(st.id)}" data-act="run">Run it</button>`;
      ladder = `<div class="olad">${hintTxt}${payload}${btn}</div>`;
    }
    const hintBtn = !okc && used < rungs.length
      ? `<button class="ohb" data-step="${esc(st.id)}" data-act="hint">${used ? "hint " + (used + 1) : "hint"}</button>` : "";
    return `<div class="obj ${okc ? "done" : ""}">
      <span class="od"></span><span class="ol">${esc(st.label)}</span>${hintBtn}${ladder}</div>`;
  }).join("");
  el("objsH").textContent = `Objectives · ${done}/${ch.steps.length}`;

  pill.classList.remove("tour");
  pill.classList.toggle("done", all);
  el("solveTxt").textContent = all ? (p.solved ? "Solved" : "Solved · hints") : `Objectives ${done}/${ch.steps.length}`;
}

el("objList").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const st = LAB.challenge?.steps.find(s => s.id === b.dataset.step); if (!st) return;
  const p = progFor(LAB.id);
  if (b.dataset.act === "hint"){ p.hints[st.id] = Math.min((p.hints[st.id] || 0) + 1, st.hints.length + 1); saveProg(); paintHud(); }
  else if (b.dataset.act === "reveal"){ p.hints[st.id] = st.hints.length + 1; saveProg(); paintHud(); }
  else if (b.dataset.act === "run"){ fire(st.reveal, "hint"); }
});

/* Generic surface binding: EVERY [data-live] input on the surface (some
   labs render two) re-derives the analysis live, coalesced to one paint
   per animation frame. Enter / submit fires through intercept if on. */
function bindSurface(){
  const inps = [...document.querySelectorAll("[data-live]")];
  document.querySelectorAll(".alertsim .ok").forEach(b =>
    b.addEventListener("click", () => {
      state.alertSeen = state.q;
      document.querySelectorAll(".alertsim").forEach(x => x.remove());
    }));
  if (!inps.length) return;
  inps.forEach(inp => {
    inp.addEventListener("input", e => {
      state.q = e.target.value;
      inps.forEach(o => { if (o !== e.target) o.value = state.q; });
      scheduleLive();
    });
    inp.addEventListener("compositionstart", () => { composing = true; });
    inp.addEventListener("compositionend", () => { composing = false; scheduleLive(); });
    const form = inp.closest("[data-run]");
    if (form) form.addEventListener("submit", ev => { ev.preventDefault(); fire(state.q, "typed"); });
    // Own the Enter key outright: implicit form submission is unreliable in
    // embedded browsers, and preventDefault here guarantees no double fire.
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Enter" && !ev.isComposing){
        ev.preventDefault();
        fire(state.q, "typed");
      }
    });
  });
}

let liveQueued = false;
function doLive(){
  liveQueued = false;
  const t0 = PERF ? performance.now() : 0;
  state.source = "typed";   // the student's own keystrokes — a live solve is a clean solve
  state.analysis = LAB.analyze(state.q);
  if (PERF) perfN.analyze = performance.now() - t0;
  for (let i = 1; i < planes.length; i++) planeDirty[i] = true;
  paintLiveSurface();       // L0 reacts live; focus/caret/IME/scroll preserved
  paintHud();
  scheduleFill();
  layout();  // taint signature (blocked/absent planes) can change per keystroke
  if (PERF) perfShow();
}
function scheduleLive(){
  if (liveQueued) return;
  liveQueued = true;
  let done = false;
  const go = () => { if (done) return; done = true; doLive(); };
  requestAnimationFrame(go);        // preferred: coalesced to a frame
  setTimeout(go, 250);              // rAF stalls in hidden tabs — the lab must not
}

function go(i){
  state.active = Math.max(0, Math.min(LAB.layers.length - 1, i));
  if (planeDirty[state.active]) renderPlane(state.active);
  layout();
  paintHud();   // trace "reached" state follows the camera
}

function descend(){
  if (reduced) return;
  const cs = getComputedStyle(document.documentElement);
  const gap = parseFloat(cs.getPropertyValue(state.cross ? "--gapx" : "--gap"));
  const N = LAB.layers.length;
  el("packet").animate(
    [{transform:"translateZ(0px) scale(.5)", opacity:0},
     {transform:`translateZ(${-gap * 0.6}px) scale(1)`, opacity:1, offset:.12},
     {transform:`translateZ(${-gap * (N - 1.4)}px) scale(1)`, opacity:1, offset:.88},
     {transform:`translateZ(${-gap * (N - 1)}px) scale(.5)`, opacity:0}],
    {duration:1150, easing:"cubic-bezier(.4,.05,.35,1)"});
  planes.forEach((p, i) => setTimeout(() => {
    p.classList.add("pulse"); setTimeout(() => p.classList.remove("pulse"), 260);
  }, 110 + i * 150));
}

function run(q, opts = {}){
  state.q = q;
  state.source = opts.source || "preset";
  const t0 = PERF ? performance.now() : 0;
  state.analysis = LAB.analyze(q);
  if (PERF) perfN.analyze = performance.now() - t0;

  // labs may record per-fire side effects (attempt logs) — analyze stays pure
  if (typeof LAB.onFire === "function" && state.source !== "boot"){
    try { LAB.onFire(state.analysis); } catch(_){}
  }

  // keep the fake browser's scroll AND which input was focused across the rebuild
  const oldInputs = planes[0] ? [...planes[0].querySelectorAll("input")] : [];
  const focusIdx = oldInputs.indexOf(document.activeElement);
  const oldSite = planes[0] && planes[0].querySelector(".site");
  const siteScroll = oldSite ? oldSite.scrollTop : 0;

  paint(); layout(); descend();

  const newSite = planes[0] && planes[0].querySelector(".site");
  if (newSite) newSite.scrollTop = siteScroll;

  if (opts.keepFocus || state.source === "typed"){
    const want = (focusIdx >= 0 && planes[0])
      ? [...planes[0].querySelectorAll("input")][focusIdx]
      : document.querySelector("[data-live]");
    if (want){ want.focus(); try { want.setSelectionRange(q.length, q.length); } catch (_){} }
  }
}

/* ══ VIRTUAL INTERCEPT ═══════════════════════════════════════════════
   Burp-style request editing, scoped to the lab's simulated request.
   STRATA makes no network calls at all — "intercepting" means pausing
   the virtual request the lab already renders on its wire layer. The
   student edits the raw bytes (URL-encoding and all), sends, and every
   layer re-derives from those bytes exactly as a real server would
   decode them. The host page's traffic is never touched. */
const ixWrap = document.createElement("div");
ixWrap.className = "ixwrap"; ixWrap.hidden = true;
ixWrap.innerHTML = `<div class="ixpanel">
  <div class="ixhead"><span class="callout">Intercept · edit the request, then send</span>
    <button class="ixx" title="Cancel">✕</button></div>
  <textarea class="ixraw" spellcheck="false" aria-label="Raw request"></textarea>
  <div class="ixfoot"><span class="ixerr"></span><button class="ixsend">Send →</button></div>
</div>`;
document.body.appendChild(ixWrap);
const ixRaw = ixWrap.querySelector(".ixraw"), ixErr = ixWrap.querySelector(".ixerr");
ixWrap.querySelector(".ixx").addEventListener("click", () => { ixWrap.hidden = true; });
ixWrap.querySelector(".ixsend").addEventListener("click", sendIx);
ixRaw.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendIx(); });

function ixAvailable(){ return !!LAB.wire && !["fragment", "offline"].includes(LAB.wire.type); }

function openIx(q){
  if (!LAB.wire) return;
  if (LAB.wire.type === "fragment"){
    toast("The fragment never leaves the browser — there is nothing to intercept. That IS the DOM-XSS lesson.");
    return;
  }
  if (LAB.wire.type === "offline"){
    toast("This lab runs offline — a scenario replays; no live request exists.");
    return;
  }
  ixRaw.value = buildRaw(q); ixErr.textContent = ""; ixWrap.hidden = false; ixRaw.focus();
}

function sendIx(){
  const r = parseRaw(ixRaw.value);
  if (r.error){ ixErr.textContent = r.error; return; }
  const sentHost = (/^host:\s*(\S+)/mi.exec(ixRaw.value) || [])[1];
  const builtHost = (/^host:\s*(\S+)/mi.exec(buildRaw(r.q)) || [])[1];
  if (sentHost && builtHost && sentHost.toLowerCase() !== builtHost.toLowerCase())
    toast("Note: this lab's origin is fixed — the Host header is scenery.");
  ixWrap.hidden = true;
  run(r.q, { source:"intercept" });
  toast("Sent — every layer re-derived from your edited bytes.");
}

el("ixBtn").addEventListener("click", () => {
  if (!LAB.wire) return;
  if (!ixAvailable()){ openIx(state.q); return; }   // emits the teaching toast
  state.ix = !state.ix;
  el("ixBtn").setAttribute("aria-pressed", String(state.ix));
  el("ixTxt").textContent = state.ix ? "Intercept on" : "Intercept";
  toast(state.ix ? "Intercept on — the next fire pauses at the wire." : "Intercept off.");
});

/* Path-wire encoding: spaces and control characters are percent-encoded,
   bare % is escaped so the round-trip can't throw — but slashes stay real. */
function encodePath(p){
  return encodeURI(String(p).startsWith("/") ? p : "/" + p)
    .replace(/%(?![0-9A-Fa-f]{2})/g, "%25");
}

/* Build the raw request the lab's surface would send for payload q. */
function buildRaw(q){
  const w = LAB.wire; if (!w) return "";
  if (w.build) return w.build(q);
  const host = w.host || "shop.aperture.lab";
  switch (w.type){
    case "query":
      return `GET ${w.path}?${w.param}=${encodeURIComponent(q)} HTTP/1.1\nHost: ${host}\nAccept: text/html,*/*\n`;
    case "path":
      return `GET ${encodePath(q)} HTTP/1.1\nHost: ${host}\nAccept: */*\n`;
    case "json":
      return `POST ${w.path} HTTP/1.1\nHost: ${host}\nContent-Type: application/json\n\n${JSON.stringify({ [w.param]: q })}\n`;
    case "form":
      return `POST ${w.path} HTTP/1.1\nHost: ${host}\nContent-Type: application/x-www-form-urlencoded\n\n${w.param}=${encodeURIComponent(q)}\n`;
    case "login": {
      const [email = "", pw = ""] = splitCreds(q);
      return `POST /login HTTP/1.1\nHost: ${host}\nContent-Type: application/x-www-form-urlencoded\n\nemail=${encodeURIComponent(email)}&password=${encodeURIComponent(pw)}\n`;
    }
    default: return "";
  }
}

/* Parse the student's edited bytes back into a payload, the way the
   origin would: URL-decoding query params and form bodies, JSON-parsing
   JSON. Editing the wire means owning your own encoding. */
function parseRaw(raw){
  const w = LAB.wire; if (!w) return { error:"This lab has no interceptable request." };
  if (w.parse){
    try { return w.parse(raw); } catch (err){ return { error:"Couldn't parse: " + err.message }; }
  }
  try {
    const lines = raw.replace(/\r/g, "").split("\n");
    const m = /^([A-Z]+)\s+(.+?)(?:\s+HTTP\/[\d.]+)?\s*$/.exec((lines[0] || "").trim());
    if (!m) return { error:"Can't read the request line — expected e.g. GET /path HTTP/1.1" };
    const target = m[2];
    const blank = lines.findIndex(l => l.trim() === "");
    const body = blank >= 0 ? lines.slice(blank + 1).join("\n").replace(/\n+$/, "") : "";

    switch (w.type){
      case "query": {
        const qi = target.indexOf("?");
        const ps = new URLSearchParams(qi >= 0 ? target.slice(qi + 1) : "");
        if (!ps.has(w.param)) return { error:`No ?${w.param}= in the request line.` };
        return { q: ps.get(w.param) };
      }
      case "path":
        return { q: target.split("?")[0] };   // %-decoding happens in the lab's analyze, exactly once
      case "json": {
        let j; try { j = JSON.parse(body || "{}"); } catch(_){ return { error:"Body isn't valid JSON." }; }
        if (!(w.param in j)) return { error:`Body has no "${w.param}" field.` };
        return { q: String(j[w.param]) };
      }
      case "form": {
        const ps = new URLSearchParams(body);
        if (!ps.has(w.param)) return { error:`Body has no ${w.param}= field.` };
        return { q: ps.get(w.param) };
      }
      case "login": {
        const ps = new URLSearchParams(body);
        return { q: `${ps.get("email") || ""} : ${ps.get("password") || ""}` };
      }
      default:
        return { error:"This lab can't be intercepted." };
    }
  } catch (err){ return { error:"Couldn't parse: " + err.message }; }
}

/* ── INPUT ── */
addEventListener("keydown", e => {
  if (!el("exwrap").hidden){ if (e.key === "Escape") el("exwrap").hidden = true; return; }
  if (!ixWrap.hidden){ if (e.key === "Escape") ixWrap.hidden = true; return; }
  if (el("labview").hidden) return;   // inert on the catalog
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape"){ if (!typing && !e.isComposing) goHome(); return; }
  if (e.altKey && e.code === "Space"){ e.preventDefault(); state.cross = !state.cross; layout(); return; }
  if (e.altKey && /^Digit[0-9]$/.test(e.code)){ e.preventDefault(); go(+e.code.slice(5)); return; }
  const up = e.key === "ArrowUp" || e.key === "k", down = e.key === "ArrowDown" || e.key === "j";
  if ((up || down) && (e.altKey || !typing)){ e.preventDefault(); go(state.active + (down ? 1 : -1)); }
});

/* Wheel: content under the cursor scrolls FIRST. Layer navigation only
   takes the wheel when the pointer is over stage chrome, or the inner
   content is already pinned at its edge. (The old handler hijacked any
   wheel ≥12px anywhere on the stage, which made .pbody/.site unscrollable
   and teleported students between layers mid-scroll.) */
function scrollableWithin(t){
  let n = t;
  while (n && n !== stageEl){
    if (n.nodeType === 1 && n.scrollHeight > n.clientHeight + 1){
      const oy = getComputedStyle(n).overflowY;
      if (oy === "auto" || oy === "scroll") return n;
    }
    n = n.parentElement;
  }
  return null;
}
stageEl.addEventListener("wheel", e => {
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // Firefox classic mice report lines
  if (Math.abs(dy) < 12) return;
  const sc = scrollableWithin(e.target);
  if (sc){
    const atTop = sc.scrollTop <= 0;
    const atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1;
    if ((dy > 0 && !atBottom) || (dy < 0 && !atTop)) return;  // let the content scroll
  }
  const next = state.active + (dy > 0 ? 1 : -1);
  if (next < 0 || next > LAB.layers.length - 1) return;
  e.preventDefault();
  const now = performance.now();
  if (now - (stageEl._t || 0) < 340) return;
  stageEl._t = now; go(next);
}, { passive:false });

/* resize: tokens change at breakpoints — re-read once, then layout, in a frame */
let rzQueued = false;
addEventListener("resize", () => {
  if (rzQueued) return; rzQueued = true;
  requestAnimationFrame(() => { rzQueued = false; readTokens(); layout(); });
});
readTokens();

/* ── HOME / CATALOG ── */
function buildHome(){
  const order = [], byCat = {};
  LABS.forEach(l => { if (!byCat[l.cat]){ byCat[l.cat] = []; order.push(l.cat); } byCat[l.cat].push(l); });
  const card = l => {
    const m = CARD[l.id] || l.card || { sig:Array(l.layers.length).fill("a"), blurb: esc(l.blurb || "") };
    const strip = m.sig.slice(0, l.layers.length).map(c => `<i class="sg-${c}"></i>`).join("");
    const start = l.id === "foundations" ? `<span class="startchip">Start here</span>` : "";
    return `<button class="labcard" data-id="${l.id}">
      <div class="lc-top"><span class="lc-code">${esc(l.code)}</span><span class="lc-diff">${esc(l.difficulty)}</span>${start}</div>
      <div class="lc-title">${esc(l.title)}</div>
      <div class="lc-blurb">${m.blurb}</div>
      <div class="lc-strip"><span class="sig">${strip}</span><span class="lc-go">Open ›</span></div>
    </button>`;
  };
  const tracks = order.map(cat =>
    `<section class="track"><h2 class="track-h">${esc(cat)}</h2><div class="cardgrid">${byCat[cat].map(card).join("")}</div></section>`).join("");
  el("home").innerHTML = `<div class="home-inner">
    <header class="hero">
      <div class="hero-mark">STRATA</div>
      <h1 class="hero-h">See <em>why</em> a vulnerability works — not just how to trigger it.</h1>
      <p class="hero-sub">Every lab is a real, working app. Open one and fly straight down through its layers — the page, the browser code, the network, the server, the database — watching your input travel the whole stack. Solve labs by <b>typing the payload yourself</b>; hints are there when you need them. New to this? <b>Start with Foundations</b> to learn what the layers even are.</p>
    </header>
    ${tracks}
    <section class="track"><h2 class="track-h">Your labs</h2><div class="cardgrid">
      <button class="labcard addlab" id="addLabBtn" type="button">
        <div class="lc-top"><span class="lc-code">＋</span></div>
        <div class="lc-title">Load a lab file</div>
        <div class="lc-blurb">Drop or pick a <code>…lab.js</code> written in the STRATA lab format — it’s validated (and smoke-run) on load. Written for humans and AI authors alike: see <a href="docs/AUTHORING.md">the authoring guide</a>.</div>
        <div class="lc-strip"><span class="lc-go">Authoring docs ›</span></div>
      </button>
    </div></section>
    <section class="notes">
  <h2>How STRATA works</h2>
  <p class="lede">STRATA turns a vulnerable app into a cross-section you fly through: seven planes stacked in depth, all rendering the same request at once. Fourteen labs ship in this file — Foundations, the OWASP Top 10, and the injection set — and the catalog takes any number more: a lab file is a plain <code>.js</code> away (see the authoring guide). The same instrument teaches every bug class without changing its rules.</p>

  <h3>These are real labs, not click-throughs</h3>
  <p>Every lab carries <b>objectives</b> in the side rail — phases of the actual attack, from “break the literal” to “exfiltrate the table.” You complete them by making the engine say so, which means <em>typing the payload yourself</em> (or editing the raw request — more on that below). Hints reveal progressively, rung by rung, and the final rung shows the payload — but a solve earned that way is labeled. The preset that completes the final objective stays locked until you’ve solved the lab. Progress persists in your browser.</p>

  <h3>The one rule that makes it teach</h3>
  <p>Every byte that originated from the student is drawn in <b style="color:var(--taint)">amber</b>, at every layer, without exception. Nothing else in the interface is warm. You track your own payload from keystroke to query string to parser to DOM without being told where to look — and the moment amber stops being <em>data</em> and becomes <em>syntax</em> (SQL) or <em>markup</em> (HTML) is visible, not narrated.</p>

  <div class="swatches">
    <div class="sw"><i style="background:var(--taint)"></i><div><div class="n">Taint</div><div class="d">User-controlled bytes. The only warm hue in the system.</div></div></div>
    <div class="sw"><i style="background:var(--signal)"></i><div><div class="n">Signal</div><div class="d">The instrument itself — chrome, labels, keywords.</div></div></div>
    <div class="sw"><i style="background:var(--breach)"></i><div><div class="n">Breach</div><div class="d">A boundary crossed, a parser broken, a request blocked.</div></div></div>
    <div class="sw"><i style="background:var(--ok)"></i><div><div class="n">Safe</div><div class="d">Data that stayed data. The baseline you’re breaking.</div></div></div>
  </div>

  <h3>Each lab has a different taint signature</h3>
  <p>The reason the same seven planes teach four bugs is that the payload takes a <b>different path</b> through them each time. Fly to cross-section view (<kbd>⌥</kbd><kbd>space</kbd>) and the shape is legible at a glance:</p>
  <ul>
    <li><b>Lab 01 · SQL injection</b> — taint present at every layer; it crosses the <em>trust boundary</em> at the server’s f-string and is promoted from string data to SQL syntax at the parser. A hand-written lexer computes quote balance and comment position, so a lone <code>'</code> produces a real unterminated-literal error at a real offset.</li>
    <li><b>Lab 02 · Reflected XSS</b> — taint present at every layer; the server reflects it unescaped into the response, and the HTML tokenizer promotes it from text to markup. Because it is parsed at page load, even a bare <code>&lt;script&gt;</code> runs.</li>
    <li><b>Lab 03 · DOM XSS</b> — taint <em>tunnels through the client and skips the network entirely.</em> The payload lives in the URL fragment, which browsers never send, so the request, edge, and server planes go dark — the bug is a source→sink flow in client JS. And <code>&lt;script&gt;</code> written via <code>innerHTML</code> is built but never runs; you need a self-firing handler.</li>
    <li><b>Lab 04 · Reflected XSS + WAF</b> — taint is stopped at the <em>edge</em> unless you slip past it. The filter is a blocklist, and the lesson is that its grammar (string matching) and the browser’s grammar (HTML tokenizing) disagree — <code>&lt;svg onload&gt;</code> is not on the list, and no finite list covers every tag and handler.</li>
  </ul>

  <h3>The engine is honest</h3>
  <p>Under the surface, each lab runs a real analysis, not a lookup table. The XSS engine tokenizes the payload and distinguishes what auto-fires when server-reflected versus when written through <code>innerHTML</code>. The SQL lexer computes quote balance and comment offsets. The crypto lab runs a genuine MD5 (RFC 1321) against a wordlist hashed at load. The SSRF lab canonicalizes IPs — decimal, hex, octal-dropped, IPv6-mapped — before classifying them, so alternate spellings really do reach the metadata service. And the <b>intercept</b> toggle pauses the lab’s <em>virtual</em> request so you can edit the raw bytes Burp-style: the parser URL-decodes your edits exactly as an origin would. Nothing actually executes — the <code>alert()</code> on the surface is a simulated dialog once the engine has proven the vector would fire. Same philosophy everywhere: real reasoning, simulated effect. STRATA itself makes zero network requests.</p>

  <h3>Infinite labs, humans and AI alike</h3>
  <p>A lab is data: layers, presets, a pure <code>analyze()</code>, per-layer renderers, objectives, hints — one contract, validated and smoke-run on load. <code>STRATA.registerLab()</code> (exposed to lab files, documented in <code>docs/AUTHORING.md</code>) is the seam: drop a lab file onto the catalog to add it. That makes every workflow real — “build me a lab from this HackerOne report,” “harder XSS please,” “show me how this code gets exploited” — because the format, the validator, and the golden examples are all a person or an AI needs to author in this style.</p>

  <h3>What a production build needs next</h3>
  <p>A lab-manifest catalog on disk with a community index; a sandboxed backend for server-side labs (free-typed exploits against a real origin, not a simulation); per-layer <em>defense</em> annotations that light up green when a student patches the right plane — parameterize the query, escape the template, write to <code>textContent</code>; and progress sync. The layer engine, the taint renderer, the challenge system and the cross-section are the reusable core — everything else is lab content.</p>
</section>

    <footer class="home-foot">Runs entirely in your browser — payloads are analyzed, never executed · progress lives in localStorage</footer>
  </div>`;
  [...el("home").querySelectorAll(".labcard")].forEach(b =>
    b.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      if (b.dataset.id) enterLab(b.dataset.id);
      else if (b.id === "addLabBtn") pickLabFile();
    }));
}
/* file picker + drag-drop for lab files */
const labFileInput = Object.assign(document.createElement("input"),
  { type:"file", accept:".js,.txt,text/javascript" });
labFileInput.style.display = "none";
document.body.appendChild(labFileInput);
function pickLabFile(){ labFileInput.value = ""; labFileInput.click(); }
labFileInput.addEventListener("change", () => {
  const f = labFileInput.files[0];
  if (f) f.text().then(code => loadLabText(code, f.name));
});
addEventListener("dragover", e => { if (!el("labview").hidden) return; e.preventDefault(); });
addEventListener("drop", e => {
  if (!el("labview").hidden) return;
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) f.text().then(code => loadLabText(code, f.name));
});

function enterLab(id){
  clearTimeout(enterLab._t);
  el("home").hidden = true;
  el("labview").hidden = false;
  document.body.classList.add("in-lab");
  buildLab(id);
  window.scrollTo(0, 0);
  if (!reduced){
    state.cross = true; state.active = 0; layout();
    enterLab._t = setTimeout(() => { state.cross = false; layout(); }, 1400);
  }
}
function goHome(){
  el("labview").hidden = true;
  el("exwrap").hidden = true;
  el("home").hidden = false;
  document.body.classList.remove("in-lab");
  window.scrollTo(0, 0);
}
el("homeBtn").addEventListener("click", goHome);

buildHome();     // land on the catalog; a lab is built only when picked
